<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. A coral ring is the recurring object: the week on Home, the session in Replay, the clock in Insights. Cards are used only where content needs a container. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0D0D12; --surface:#191820; --surface2:#22212C; --line:#2F2D3B;
  --coral:#FF5C87; --pink:#FFA3BF; --text:#F8F5F7; --muted:#A9A1C6; --dim:#7A7494;
  --ok:#7BE0B5; --warn:#FFC670; --danger:#FF7A6B;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --body:"Schibsted Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:22px; --r-sm:14px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
.scroll:focus{outline:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media(min-width:520px){body{background:#08080b}#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 28px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;border-top:1px solid var(--line);background:rgba(13,13,18,.96);padding:0 6px env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.02em;position:relative;transition:color .15s}
.tab::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--coral);transform:scaleX(0);transition:transform .2s}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{transform:scaleX(1)}
.tab[aria-current="page"] svg{color:var(--coral)}
.tab svg{width:23px;height:23px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mark{font-family:var(--display);font-style:italic;font-size:30px;line-height:1;letter-spacing:-.01em}
.mark b{color:var(--coral);font-weight:400}
h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em{color:var(--pink)}
h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.12;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
p.sub,.sub{color:var(--muted)}
.small{font-size:13px}.tiny{font-size:12px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.line{background:none;border:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.row:first-child{align-items:baseline}
.rule{height:1px;background:var(--line);border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--surface2);color:var(--text);transition:transform .12s,background .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--coral);color:#1a0810}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid rgba(255,122,107,.5);color:var(--danger)}
.btn.sm{min-height:44px;padding:0 16px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.busy{opacity:.6;pointer-events:none}
.link{color:var(--pink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,163,191,.4);min-height:44px;display:inline-flex;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border-radius:var(--r-sm);padding:14px 12px;min-width:0}
.tile b{display:block;font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio div{padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.trio div:first-child{border-left:0;padding-left:0}
.trio b{display:block;font-family:var(--display);font-weight:400;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.trio span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal span.h{color:var(--dim);font-weight:700;aspect-ratio:auto;padding-bottom:2px}
.cal span.on{background:rgba(255,92,135,.2);color:var(--text);font-weight:700}
.cal span.on2{background:var(--coral);color:#1a0810;font-weight:700}
.cal span.today{box-shadow:inset 0 0 0 1.5px var(--pink)}
.sess{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:60px;border-top:1px solid var(--line);width:100%;text-align:left}
.sess:first-of-type{border-top:0}
.sess .d{width:44px;text-align:center;flex:none}
.sess .d b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.sess .d span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sess .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
button.pill{min-height:44px;padding:0 14px}
.pill.c{background:rgba(255,92,135,.16);color:var(--pink)}
.pill.w{background:rgba(255,198,112,.14);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--coral);color:#1a0810}
.seg3{display:flex;background:var(--surface);border-radius:999px;padding:4px}
.seg3 button{flex:1;min-height:40px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
label.f em{font-style:normal;font-weight:500;color:var(--dim);letter-spacing:0}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],input[type=password],textarea{width:100%;min-height:48px;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);padding:12px 14px;font-size:16px;font-weight:500;color:var(--text);letter-spacing:0}
input:focus,textarea:focus{outline:none;border-color:var(--coral)}
textarea{min-height:84px;resize:vertical}
.sw{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;min-height:48px;width:100%;text-align:left}
.sw .k{width:46px;height:28px;border-radius:999px;background:var(--surface2);position:relative;flex:none;transition:background .15s}
.sw .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"] .k{background:var(--coral)}
.sw[aria-checked="true"] .k::after{transform:translateX(18px);background:#1a0810}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 2px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.ib.bare{background:none}
.clock{font-size:54px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stage{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stage .in{position:relative;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stage [data-act]{cursor:pointer}
.stage g:focus-visible{outline:none}
.stage g:focus-visible path.vis{stroke:var(--text)}
.orb{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 35% 30%,#FFA3BF,#FF5C87 70%);color:#1a0810;font-weight:800;box-shadow:0 0 0 10px rgba(255,92,135,.08),0 18px 50px rgba(255,92,135,.28);transition:transform .15s}
.orb:active{transform:scale(.96)}
.orb svg{width:38px;height:38px}
.orb.dark{background:var(--surface);color:var(--text);box-shadow:0 0 0 10px rgba(255,92,135,.08)}
.orb .mc{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.live .glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.enter .scroll>*,.enter .ob>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.enter .scroll>*:nth-child(2){animation-delay:.04s}.enter .scroll>*:nth-child(3){animation-delay:.08s}.enter .scroll>*:nth-child(4){animation-delay:.12s}.enter .scroll>*:nth-child(5){animation-delay:.16s}.enter .scroll>*:nth-child(n+6){animation-delay:.2s}
.enter path.seg{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s .15s cubic-bezier(.3,.7,.2,1) forwards}
.enter .badge.on.new{animation:pop .5s .5s both}
.overlay.in{animation:fade .2s both}.overlay.in .sheet{animation:up .28s cubic-bezier(.2,.7,.2,1) both}
.toast{animation:rise .25s both}
.skel{border-radius:var(--r);height:150px;background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 100px,var(--surface) 200px);background-size:400px 100%;animation:shimmer 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.overlay{position:absolute;inset:0;background:rgba(5,5,8,.72);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet:focus{outline:none}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--text);color:#15131c;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:30;text-align:center}
.banner{background:rgba(255,198,112,.12);color:var(--warn);border-radius:var(--r-sm);padding:6px 14px;min-height:44px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.ok{background:rgba(123,224,181,.12);color:var(--ok)}
.ob{flex:1;display:flex;flex-direction:column;padding:26px 24px calc(22px + env(safe-area-inset-bottom));gap:18px;overflow-y:auto}
.ob .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.steps{display:flex;gap:5px}.steps i{height:3px;flex:1;border-radius:3px;background:var(--surface2)}.steps i.on{background:var(--coral)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-sm);border:1.5px solid var(--line);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--coral);background:rgba(255,92,135,.08)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt b{display:block}
.share{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;color:#1a0810}
.share.s0{background:linear-gradient(140deg,#FF5C87,#FFA3BF)}
.share.s1{background:linear-gradient(150deg,#2B1E33,#191820);color:var(--text);box-shadow:inset 0 0 0 1px #4a3350}
.share.s2{background:linear-gradient(140deg,#FFA3BF,#F8F5F7)}
.share.s3{background:#0D0D12;color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--coral)}
.share svg.deco{position:absolute;right:-46px;top:-46px;width:190px;height:190px;opacity:.28}
.share .big{position:relative;font-family:var(--display);font-size:34px;line-height:1.02;overflow-wrap:anywhere;max-width:85%}
.share .meta{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13px}
.share .meta span{padding:4px 10px;border-radius:999px;background:rgba(26,8,16,.14)}
.share.s1 .meta span,.share.s3 .meta span{background:rgba(255,163,191,.16);color:var(--pink)}
.share .wm{font-family:var(--display);font-style:italic;font-size:20px;opacity:.8}
.post{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--pink);flex:none}
.rx{display:flex;gap:6px;flex-wrap:wrap}
.rx button{min-height:44px;min-width:52px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;transition:transform .12s,background .15s}
.rx button:active{transform:scale(1.15)}
.rx button[aria-pressed="true"]{background:rgba(255,92,135,.22);color:var(--text)}
.cm{font-size:14px;padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.cm b{color:var(--pink)}
.ach{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ach:first-of-type{border-top:0}
.badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--dim);font-family:var(--display);font-style:italic;font-size:22px;flex:none}
.badge.on{background:linear-gradient(140deg,#FF5C87,#FFA3BF);color:#1a0810}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .b{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.hs .b.on{color:var(--text)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.hm i.l1{background:rgba(255,92,135,.35)}.hm i.l2{background:rgba(255,92,135,.65)}.hm i.l3{background:var(--coral)}.hm i.f{opacity:.25}
.grid74{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;align-items:center;font-size:11px;color:var(--dim);font-weight:600}
.grid74 i{aspect-ratio:1.5;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--text);font-variant-numeric:tabular-nums}
.grid74 span{text-align:center}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.bar i{background:var(--coral)}.bar i.p{background:transparent}
.tl{display:flex;height:44px;align-items:center}
.tl button{height:44px;display:flex;align-items:center;padding:0;min-width:6px}
.tl button i{display:block;width:100%;height:14px;border-radius:7px;background:var(--coral);opacity:.55;transition:opacity .15s,height .15s}
.tl button[aria-pressed="true"] i{opacity:1;height:22px;border-radius:11px}
.tl span{height:2px;background:var(--line)}
.pair{display:flex;flex-direction:column;gap:5px}
.pair .bar{height:8px}
.hb{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .bar{height:10px}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.pin{letter-spacing:.5em;text-align:center;font-size:24px!important}
ul.plain{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
ul.plain li svg{color:var(--coral);margin-top:2px}
ul.plain li.p svg{color:var(--warn)}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const DAY=864e5, WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const startOfWeek=t=>{const d=new Date(startOfDay(t));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const fmtClock=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+"h "+pad(m)+"m":m?m+"m"+(x&&m<10?" "+x+"s":""):x+"s"};
const fmtMin=s=>{const m=s/60;return m>=10?Math.round(m):Math.round(m*10)/10};
const fmtDate=t=>{const d=new Date(t);return WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()]};
const fmtTime=t=>{const d=new Date(t);let h=d.getHours();const a=h<12?"am":"pm";h=h%12||12;return h+":"+pad(d.getMinutes())+a};
const toLocalInput=t=>{const d=new Date(t);return dayKey(t)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const reduced=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return true}};
const PARTS=["Morning","Afternoon","Evening","Night"],PARTH=["5am to noon","noon to 5pm","5pm to 10pm","10pm to 5am"];
const partOf=h=>h>=5&&h<12?0:h>=12&&h<17?1:h>=17&&h<22?2:3;

/* What sync and export carry: never demo rows, never social keys. */
const vaultPayload=()=>({v:1,stamp:S.stamp,user:S.user,settings:S.settings,sessions:S.sessions.filter(s=>!s.demo),deleted:S.deleted,blocks:S.blocks,ignored:S.ignored});
/* Two devices: keep the newer copy of each session, honour deletions from either side. */
function mergeVault(v){const del=Object.assign({},v.deleted||{});for(const k in S.deleted)del[k]=Math.max(del[k]||0,S.deleted[k]);
  const m={};for(const s of (v.sessions||[]).concat(S.sessions)){const c=m[s.id];if(!c||(s.updatedAt||0)>(c.updatedAt||0))m[s.id]=s}
  S.sessions=Object.values(m).filter(s=>!(del[s.id]>=(s.updatedAt||0)));S.deleted=del;
  if((v.stamp||0)>S.stamp){S.settings=Object.assign(fresh().settings,v.settings);S.blocks=v.blocks||[];S.ignored=v.ignored||[];S.user=Object.assign({},v.user,{mode:"account"})}}

/* ============ keys: connections-only content is encrypted in the browser ============ */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s="";new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>Array.from(new Uint8Array(u)).map(b=>b.toString(16).padStart(2,"0")).join("");
const cat=(a,s)=>{const t=te.encode(s),o=new Uint8Array(a.length+t.length);o.set(a);o.set(t,a.length);return o};
const K={ok:!!(window.crypto&&crypto.subtle),priv:null,self:null,pairs:{},
  async gen(){const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);
    return{pub:await crypto.subtle.exportKey("jwk",kp.publicKey),priv:await crypto.subtle.exportKey("jwk",kp.privateKey),self:b64(crypto.getRandomValues(new Uint8Array(32)))}},
  async load(k){this.priv=await crypto.subtle.importKey("jwk",k.priv,{name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);this.self=await this.aes(ub64(k.self));this.pairs={}},
  reset(){this.priv=null;this.self=null;this.pairs={}},
  aes(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"])},
  /* A shared secret with one other person. out/in are one-way labels only the two of us can compute, so stored lists don't reveal who is connected to whom. */
  async pair(id,pubJwk){const ck=id+"|"+pubJwk.x+pubJwk.y;if(this.pairs[ck])return this.pairs[ck];
    const pub=await crypto.subtle.importKey("jwk",pubJwk,{name:"ECDH",namedCurve:"P-256"},false,[]);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:pub},this.priv,256));
    const h=async l=>new Uint8Array(await crypto.subtle.digest("SHA-256",cat(bits,l)));
    return this.pairs[ck]={out:hex(await h("|"+Cloud.uid+">"+id)).slice(0,32),in:hex(await h("|"+id+">"+Cloud.uid)).slice(0,32),key:await this.aes(await h("|vouz-wrap"))}},
  async enc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes)),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)},
  async dec(key,s){const u=ub64(s);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12)))},
  encJ(key,o){return this.enc(key,te.encode(JSON.stringify(o)))},
  async decJ(key,s){return JSON.parse(td.decode(await this.dec(key,s)))},
  async thread(raw){return hex(await crypto.subtle.digest("SHA-256",cat(raw,"|vouz-thread"))).slice(0,24)}
};

/* ============ social data-access layer ============
   Shared storage holds: profiles (handle + public key), posts, reactions, comments, links.
   "Everyone" cards are stored readable. Connections-only cards are stored as ciphertext with one wrapped key per
   permitted recipient; reconcile() is the single place that decides who gets a key. No key, no card. */
const SHARED=["profiles","posts","reactions","comments","links","invites"];
const Soc={profiles:{},posts:{},reactions:{},comments:{},links:{},invites:{},inbox:[],inv:{},invSig:"",rel:{},items:[],cm:{},perms:{},cache:{},au:{},subs:[],status:"off",wq:{},t:null,busy:false,again:false,
  async ensureKeys(){if(!S.keys){const d=await Cloud.priv("keys").get();if(d.exists)S.keys=JSON.parse(d.data().json);else{S.keys=await K.gen();await Cloud.priv("keys").set({json:JSON.stringify(S.keys)})}saveLocal()}
    if(!K.priv)await K.load(S.keys)},
  async start(){if(this.subs.length||Cloud.state!=="ready"||!K.ok)return;this.status="loading";
    try{await this.ensureKeys()}catch(e){this.status="error";return}
    const timer=setTimeout(()=>{if(this.status==="loading"){this.status="slow";render()}},10000);
    for(const c of SHARED)this.subs.push(Cloud.db.collection(c).onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()||{}});this[c]=m;if(c==="posts")clearTimeout(timer);this.sched()},()=>{clearTimeout(timer);this.status="error";render()}))},
  stop(){this.subs.forEach(u=>{try{u()}catch(e){}});this.subs=[];this.status="off";clearTimeout(this.t);for(const c of SHARED)this[c]={};this.inbox=[];this.inv={};this.invSig="";this.rel={};this.items=[];this.cm={};this.perms={};this.cache={};this.au={}},
  sched(){clearTimeout(this.t);this.t=setTimeout(async()=>{if(this.busy){this.again=true;return}this.busy=true;
    try{await this.recompute()}catch(e){}this.busy=false;if(this.status==="loading"||this.status==="slow")this.status="ready";
    const sig=JSON.stringify([this.inbox.map(x=>x.a+x.i),this.inv]),moved=sig!==this.invSig;this.invSig=sig;
    if((ui.tab==="social"||ui.tab==="profile"||ui.page&&ui.page.type==="compose"||moved)&&!typing())render();
    if(this.again){this.again=false;this.sched()}},40)},
  write(coll,data){this[coll]=Object.assign({},this[coll]);if(data===null)delete this[coll][Cloud.uid];else this[coll][Cloud.uid]=data;
    const ref=Cloud.db.doc(coll+"/"+Cloud.uid);
    this.wq[coll]=(this.wq[coll]||Promise.resolve()).then(()=>data===null?ref.delete():ref.set(data)).catch(e=>{toast(e&&e.code==="invalid_argument"?"You have view-only access here, so Social can't save.":"Social couldn't save that. Try again.")});
    this.sched();return this.wq[coll]},
  me(){return this.profiles[Cloud.uid]},
  handle(id){const p=this.profiles[id];return p&&p.handle?p.handle:"Someone"},
  conns(){return Object.keys(this.rel).filter(i=>this.rel[i].mutual&&!S.blocks.includes(i))},
  allowed(id,kind){const p=this.perms[id]||{};return kind==="recap"?p.recaps!==false:p.achievements!==false},
  async recompute(){if(!K.priv)return;const me=Cloud.uid,rel={};
    for(const id in this.profiles){if(id===me)continue;const p=this.profiles[id];if(!p||!p.pub)continue;
      try{const pr=await K.pair(id,p.pub),mine=!!((this.links[me]||{}).out||{})[pr.out],theirs=!!((this.links[id]||{}).out||{})[pr.in];rel[id]={out:pr.out,in:pr.in,key:pr.key,mine,theirs,mutual:mine&&theirs}}catch(e){}}
    this.rel=rel;
    const lp=(this.links[me]||{}).p;if(lp){if(!this.au[lp]){try{this.au[lp]=await K.decJ(K.self,lp)}catch(e){this.au[lp]={}}}this.perms=this.au[lp]}else this.perms={};
    const items=[];
    for(const a in this.posts){if(a!==me&&(!this.profiles[a]||S.blocks.includes(a)))continue;
      for(const it of (this.posts[a].items||[])){if(!it)continue;
        if(it.c){const wk=it.wk||{},w=a===me?wk.self:(rel[a]&&rel[a].mutual?wk[rel[a].in]:null);if(!w)continue;
          try{let e=this.cache[it.c+w];if(!e){const raw=await K.dec(a===me?K.self:rel[a].key,w),ck=await K.aes(raw);e=this.cache[it.c+w]={raw,ck,body:await K.decJ(ck,it.c),thread:await K.thread(raw)}}
            let aud="all";if(a===me&&it.au){if(!this.au[it.au]){try{this.au[it.au]=await K.decJ(K.self,it.au)}catch(x){this.au[it.au]={aud:[]}}}aud=this.au[it.au].aud}
            items.push({a,key:e.thread,ck:e.ck,raw:e.raw,aud,sealed:true,n:Object.keys(wk).length-1,it:{id:it.id,vis:"connections",postedAt:it.postedAt,kind:e.body.kind,caption:e.body.caption,card:e.body.card}})}catch(e){}}
        else if(it.vis==="everyone")items.push({a,key:a+"_"+it.id,it})}}
    items.sort((x,y)=>(y.it.postedAt||0)-(x.it.postedAt||0));this.items=items;
    const byKey={};items.forEach(x=>byKey[x.key]=x);const cm={};
    for(const u in this.comments){if(u!==me&&(!this.profiles[u]||S.blocks.includes(u)))continue;
      for(const c of (this.comments[u].items||[])){const p=byKey[c&&c.post];if(!p)continue;let text;
        if(c.c){if(!p.ck)continue;try{text=this.cache["c"+c.c]||(this.cache["c"+c.c]=(await K.decJ(p.ck,c.c)).text)}catch(e){continue}}else if(!p.sealed)text=c.text;else continue;
        (cm[c.post]=cm[c.post]||[]).push({u,id:c.id,text:String(text||""),at:c.at})}}
    for(const k in cm)cm[k].sort((x,y)=>x.at-y.at);this.cm=cm;
    await this.readInvites();
    await this.reconcile()},
  /* Session invites. One sealed note per invited connection, readable only by that person, carrying date, time, duration and category and nothing else.
     Only mutual, unblocked connections are read, and nothing is added to anyone's log until they accept. */
  async readInvites(){const me=Cloud.uid,inbox=[],out={},mine=this.invites[me]||{};
    const open=async(key,c)=>this.cache["i"+c]||(this.cache["i"+c]=await K.decJ(key,c));
    for(const id in this.rel){const r=this.rel[id];if(!r.mutual||S.blocks.includes(id))continue;const done={},d=this.invites[id]||{};
      for(const x of (mine.resp||[]))if(x&&x.k===r.out)done[x.i]=1;
      for(const x of (d.items||[])){if(!x||x.k!==r.in||done[x.i])continue;
        try{const b=await open(r.key,x.c),st=+b.start,du=Math.round(+b.dur);if(b.i!==x.i||!(st>0)||st>Date.now()+6e4||!(du>=1&&du<=86400))continue;
          inbox.push({a:id,i:String(x.i),start:st,dur:du,cat:CAT_PICK.includes(b.cat)?b.cat:null})}catch(e){}}
      for(const x of (d.resp||[])){if(!x||x.k!==r.in)continue;try{const b=await open(r.key,x.c);if(b.i===x.i)out[id+"|"+x.i]=b.ok?"yes":"no"}catch(e){}}}
    this.inbox=inbox.sort((a,b)=>b.start-a.start);this.inv=out},
  ready(){return S.settings.social&&Cloud.state==="ready"&&K.ok&&!!K.priv&&this.status==="ready"},
  async invite(sess,id){const r=this.rel[id];if(!r||!r.mutual)throw 0;const i=uid(),cur=this.invites[Cloud.uid]||{};
    const c=await K.encJ(r.key,{i,start:sess.start,dur:sess.durationSec,cat:CAT_PICK.includes(sess.category)?sess.category:null});
    await this.write("invites",{items:(cur.items||[]).concat([{i,k:r.out,c}]),resp:cur.resp||[]});return i},
  uninvite(ids){const cur=this.invites[Cloud.uid];if(!cur||!(cur.items||[]).some(x=>ids.includes(x.i)))return Promise.resolve();
    return this.write("invites",{items:cur.items.filter(x=>!ids.includes(x.i)),resp:cur.resp||[]})},
  async respond(id,i,ok){const r=this.rel[id];if(!r)throw 0;const cur=this.invites[Cloud.uid]||{};
    const c=await K.encJ(r.key,{i,ok:!!ok});
    await this.write("invites",{items:cur.items||[],resp:(cur.resp||[]).filter(x=>!(x.k===r.out&&x.i===i)).concat([{i,k:r.out,c}])})},
  /* Called when a session is deleted or a person is taken off it: withdraw what I sent, or tell the sender I'm out. */
  async drop(people){if(!this.ready()||!people||!people.length)return;const sent=people.filter(p=>!p.from).map(p=>p.i);
    try{if(sent.length)await this.uninvite(sent);for(const p of people)if(p.from&&this.rel[p.id])await this.respond(p.id,p.i,false)}catch(e){}},
  /* Seal a card: random content key, body encrypted with it, key wrapped for me only. Recipients are added by reconcile(). */
  async seal(id,body,aud,postedAt){const raw=crypto.getRandomValues(new Uint8Array(32)),ck=await K.aes(raw),c=await K.encJ(ck,body),self=await K.enc(K.self,raw),au=await K.encJ(K.self,{aud});
    this.cache[c+self]={raw,ck,body,thread:await K.thread(raw)};this.au[au]={aud};return{id,vis:"connections",postedAt,c,au,wk:{self}}},
  /* The only place recipient keys are granted or withdrawn. Runs after every change to connections, permissions, blocks or audiences. */
  async reconcile(){const me=Cloud.uid,cur=this.posts[me];if(!cur||!cur.items||this.reconciling)return;let changed=false;const out=[],conns=this.conns();
    for(let it of cur.items){if(!it)continue;
      if(!it.c){if(it.vis==="connections"){it=await this.seal(it.id,{kind:it.kind,caption:it.caption||"",card:it.card||{}},"all",it.postedAt);changed=true}else{out.push(it);continue}}
      const e=this.cache[it.c+(it.wk||{}).self];if(!e){out.push(it);continue}
      const aud=it.au&&this.au[it.au]?this.au[it.au].aud:"all",want={self:it.wk.self};
      for(const i of conns){if(!this.allowed(i,e.body.kind))continue;if(aud!=="all"&&!(Array.isArray(aud)&&aud.includes(i)))continue;const t=this.rel[i].out;want[t]=it.wk[t]||await K.enc(this.rel[i].key,e.raw)}
      if(Object.keys(want).sort().join()!==Object.keys(it.wk).sort().join())changed=true;
      out.push(Object.assign({},it,{wk:want}))}
    if(changed){this.reconciling=true;await this.write("posts",{items:out,hidden:cur.hidden||[]});this.reconciling=false}},
  async saveLinks(out,perms){return this.write("links",{out,p:await K.encJ(K.self,perms)})},
  setLink(id,on){const out=Object.assign({},(this.links[Cloud.uid]||{}).out),t=this.rel[id]&&this.rel[id].out;if(!t)return Promise.resolve();if(on)out[t]=1;else delete out[t];
    const perms=Object.assign({},this.perms);if(!on)delete perms[id];return this.saveLinks(out,perms)},
  setPerm(id,p){return this.saveLinks(Object.assign({},(this.links[Cloud.uid]||{}).out),Object.assign({},this.perms,{[id]:p}))},
  /* Social off without deleting: move my shared documents into my private space, so nothing of mine is left readable. */
  async stash(){const o={};for(const c of ["posts","reactions","comments","links","invites"])if(this[c][Cloud.uid])o[c]=this[c][Cloud.uid];await Cloud.priv("stash").set({json:JSON.stringify(o)})},
  async unstash(){try{const s=await Cloud.priv("stash").get();if(!s.exists)return;const o=JSON.parse(s.data().json);for(const c in o)if(SHARED.includes(c))await Cloud.db.doc(c+"/"+Cloud.uid).set(o[c]);await Cloud.priv("stash").delete()}catch(e){}}
};

/* ============ sanitized share card: a whitelist, never a copy of the session ============ */
function buildCard(o,sess){
  const c={style:[0,1,2,3].includes(o.style)?o.style:0,title:String(o.title||"").slice(0,60)};
  if(o.kind==="recap"&&sess){
    if(o.showDuration){c.duration="About "+Math.max(5,Math.round(sess.durationSec/300)*5)+" min";c.arc=Math.min(60,Math.max(5,Math.round(sess.durationSec/300)*5))}
    if(o.showCategory&&CATS[sess.category])c.category=CATS[sess.category];
  }
  if(o.badge)c.badge=String(o.badge).slice(0,40);
  return c;
}

/* ============ derived data ============ */
const sessions=()=>S.sessions.slice().sort((a,b)=>b.start-a.start);
const hasDemo=()=>S.sessions.some(s=>s.demo);
function stats(list){const n=list.length,tot=list.reduce((a,s)=>a+s.durationSec,0);return{n,tot,avg:n?tot/n:0,longest:list.reduce((a,s)=>Math.max(a,s.durationSec),0),days:new Set(list.map(s=>dayKey(s.start))).size}}
const countByDay=list=>{const m={};list.forEach(s=>{const k=dayKey(s.start);m[k]=(m[k]||0)+1});return m};

function achievements(){
  const ss=S.sessions.slice().sort((a,b)=>a.start-b.start),u={};
  const first=f=>ss.find(f);
  if(ss[0])u.first=ss[0]; if(ss[1])u.double=ss[1]; if(ss[9])u.ten=ss[9];
  u.owl=first(s=>{const h=new Date(s.start).getHours();return h>=22||h<4});
  u.early=first(s=>{const h=new Date(s.start).getHours();return h>=5&&h<9});
  u.weekend=first(s=>[0,6].includes(new Date(s.start).getDay()));
  u.story=first(s=>(s.notes&&s.notes.trim())||(s.reflection&&s.reflection.trim()));
  let cum=0;for(const s of ss){cum+=s.durationSec;if(cum>=6000){u.century=s;break}}
  const g=S.settings.regular;
  if(g){const wk={};ss.forEach(s=>{const k=startOfWeek(s.start);(wk[k]=wk[k]||[]).push(s)});
    const keys=Object.keys(wk).map(Number).sort((a,b)=>a-b);let run=0,prev=null;
    for(const k of keys){const ok=wk[k].length>=g.perWeek;
      if(ok){run=(prev!==null&&Math.round((k-prev)/DAY)===7)?run+1:1;prev=k;if(run>=g.weeks){u.regular=wk[k][g.perWeek-1];break}}else{run=0;prev=null}}}
  return ACH.map(a=>({...a,desc:a.id==="regular"&&g?g.perWeek+" or more a week, "+g.weeks+" weeks running.":a.desc,at:u[a.id]||null}));
}
function milestonesFor(s){const out=[];achievements().forEach(a=>{if(a.at&&a.at.id===s.id)out.push({t:a.name,d:a.desc,g:a.g})});
  const before=S.sessions.filter(x=>x.start<s.start);
  if(before.length&&s.durationSec>Math.max(...before.map(x=>x.durationSec)))out.push({t:"Longest so far",d:"Your longest tracked session up to that day.",g:"L"});
  const n=before.length+1;if([5,25,50,100,250].includes(n))out.push({t:"Session "+n,d:n+" sessions tracked.",g:"#"});

  const m=Math.round(s.durationSec/60);return (m<1?"Under a minute":m+" minute"+(m===1?"":"s"))+" on a "+WDL[d.getDay()]+" "+part+"."}

/* ============ charts ============ */
const polar=(cx,cy,r,a)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
function arc(cx,cy,r,a0,a1){const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);return`M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
const arcLen=(r,a0,a1)=>(r*(a1-a0)*Math.PI/180+2).toFixed(1);
const GRAD='<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFA3BF"/></linearGradient></defs>';
/* Home: the week as a ring of seven arcs, Monday at the top. */
function weekRing(ws,cd,sel){const cx=160,cy=160,r=114,gap=7,step=360/7,today=dayKey(Date.now());let g="";
  for(let i=0;i<7;i++){const t=addDays(ws,i),k=dayKey(t),c=cd[k]||0,a0=i*step+gap/2,a1=(i+1)*step-gap/2,[lx,ly]=polar(cx,cy,r+27,(a0+a1)/2),d=arc(cx,cy,r,a0,a1);
    g+=`<g data-act="pickDay" data-i="${i}" tabindex="0" role="button" aria-pressed="${sel===i}" aria-label="${fmtDate(t)}, ${c} session${c===1?"":"s"}"><path d="${d}" stroke="transparent" stroke-width="46" fill="none" pointer-events="stroke"/><path class="vis${c?" seg":""}" d="${d}" stroke="${c?"url(#rg)":"#22212C"}" stroke-width="${sel===i?22:14}" fill="none" stroke-linecap="round" style="--len:${arcLen(r,a0,a1)}"/>${c>1?`<circle cx="${polar(cx,cy,r,(a0+a1)/2)[0].toFixed(1)}" cy="${polar(cx,cy,r,(a0+a1)/2)[1].toFixed(1)}" r="3.5" fill="#1a0810"/>`:""}</g><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${k===today?"#FFA3BF":"#7A7494"}">${WD[new Date(t).getDay()][0]}</text>`}
  return`<svg viewBox="0 0 320 320">${GRAD}${g}</svg>`}
/* Replay: the session as one 300-degree ring, active stretches drawn, pauses left open. */
function replayRing(s,sel){const segs=s.segments&&s.segments.length?s.segments:[[0,1]],t0=segs[0][0],t1=segs[segs.length-1][1],span=Math.max(1,t1-t0),A=300,off=-150,cx=160,cy=160,r=124;
  let p=`<path d="${arc(cx,cy,r,off,off+A)}" stroke="#22212C" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  segs.forEach(([a,b],i)=>{const x0=off+A*(a-t0)/span,x1=Math.max(off+A*(b-t0)/span,x0+.6);p+=`<path class="seg" d="${arc(cx,cy,r,x0,x1)}" stroke="url(#rg)" stroke-width="${sel===i?20:14}" opacity="${sel===null||sel===undefined||sel===i?1:.45}" fill="none" stroke-linecap="round" style="--len:${arcLen(r,x0,x1)}"/>`});
  return`<svg viewBox="0 0 320 320" role="img" aria-label="Session timeline ring">${GRAD}${p}</svg>`}
function trackRing(live){return`<svg viewBox="0 0 260 260" aria-hidden="true"><circle class="glow" cx="130" cy="130" r="124" fill="none" stroke="#FF5C87" stroke-width="2" opacity="${live?.4:.12}"/><circle cx="130" cy="130" r="118" fill="none" stroke="#22212C" stroke-width="12"/><circle id="hand" cx="130" cy="130" r="118" fill="none" stroke="#FF5C87" stroke-width="12" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="${S.active?741.4*(1-(elapsed(S.active)%60)/60):741.4}" transform="rotate(-90 130 130)"/></svg>`}
function bars(vals,labels,unit,color){const W=320,H=150,L=26,B=22,T=10,max=Math.max(1,...vals),n=vals.length,bw=(W-L-4)/n,ticks=max<=4?Math.ceil(max):4;let g="";
  for(let i=0;i<=ticks;i++){const v=max*i/ticks,y=T+(H-T-B)*(1-i/ticks);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#2F2D3B" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#7A7494">${Number.isInteger(v)?v:v.toFixed(1)}</text>`}
  vals.forEach((v,i)=>{const h=(H-T-B)*v/max,x=L+i*bw+bw*.18,w=bw*.64;if(v>0)g+=`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2).toFixed(1)}" fill="${color||"#FF5C87"}"><title>${esc(labels[i].full)}: ${v} ${unit}</title></rect>`;
    if(labels[i].s)g+=`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#A9A1C6">${esc(labels[i].s)}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(unit)} chart">${g}</svg>`}
function line(vals,labels){const W=320,H=120,L=30,B=18,T=10,mn=Math.min(...vals)-5,mx=Math.max(...vals)+5,n=vals.length;const X=i=>L+(W-L-8)*(n===1?.5:i/(n-1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g=`<line x1="${L}" x2="${W}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="#2F2D3B"/><line x1="${L}" x2="${W}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="#2F2D3B"/><text x="${L-6}" y="${Y(mx)+4}" text-anchor="end" font-size="10" fill="#7A7494">${mx}</text><text x="${L-6}" y="${Y(mn)+4}" text-anchor="end" font-size="10" fill="#7A7494">${mn}</text>`;
  g+=`<polyline fill="none" stroke="#FFA3BF" stroke-width="2" points="${vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="${i===n-1?"#FF5C87":"#FFA3BF"}"><title>${esc(labels[i])}: ${v} bpm</title></circle>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Average heart rate by session">${g}</svg>`}

  return`<div class="hm" style="grid-template-columns:repeat(${weeks},1fr)">${h}</div>`}
/* Insights: a 24-hour dial, midnight at the top, one spoke per starting hour. */
function dial(list){const cx=150,cy=150,r0=50,r1=112,by=Array(24).fill(0);list.forEach(s=>by[new Date(s.start).getHours()]++);const max=Math.max(1,...by);
  let g=`<circle cx="${cx}" cy="${cy}" r="${r0-8}" fill="none" stroke="#2F2D3B"/><circle cx="${cx}" cy="${cy}" r="${r1+4}" fill="none" stroke="#2F2D3B" stroke-dasharray="2 5"/>`;
  by.forEach((c,h)=>{const a=h*15+7.5,[x0,y0]=polar(cx,cy,r0,a),[x1,y1]=polar(cx,cy,r0+(r1-r0)*(c/max),a);
    g+=c?`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="url(#rg)" stroke-width="9" stroke-linecap="round"><title>${h%12||12}${h<12?"am":"pm"}: ${c} session${c===1?"":"s"}</title></line>`:`<circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="2" fill="#2F2D3B"/>`});
  [["12am",0],["6am",90],["12pm",180],["6pm",270]].forEach(([l,a])=>{const [x,y]=polar(cx,cy,r1+24,a);g+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#A9A1C6">${l}</text>`});
  return`<svg viewBox="0 0 300 300" width="100%" style="max-width:300px;align-self:center" role="img" aria-label="Sessions by starting hour">${GRAD}${g}</svg>`}

  if(!all.length)return`<div class="scroll">${head}${invitesCard()}${hero}<div class="sec" style="text-align:center;align-items:center"><h2>Nothing logged yet. <em>Good.</em></h2><p class="sub">This page starts blank and fills in from what you save, and only from that. The ring is your week: each arc is a day.</p><div class="row wrap" style="justify-content:center"><button class="btn sm" data-act="manual">${ic("plus")} Log a past session</button><button class="btn sm ghost" data-act="loadDemo">See it with demo data</button></div></div></div>`;
  const dayT=addDays(ws,sel),dayS=all.filter(s=>dayKey(s.start)===dayKey(dayT)),wk=all.filter(s=>s.start>=ws),wst=stats(wk);
  const dayBox=`<div class="sec" aria-live="polite"><div class="row between"><h3>${sel===todayI?"Today":fmtDate(dayT)}</h3><span class="sub small">This week: ${wst.n} session${wst.n===1?"":"s"}, ${fmtDur(wst.tot)}</span></div>${dayS.length?`<div>${dayS.map(sessRow).join("")}</div>`:`<p class="sub small">${dayT>Date.now()?"Still ahead.":"Nothing logged for this day."} Tap any arc on the ring to look at another day.</p>`}</div>`;

  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),lead=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),today=dayKey(Date.now());

/* ---- replay ---- */
const RPROMPT=["What do you want to remember about this one?","What made this one what it was?","Anything you'd tell your future self?"];
function vReplay(){const s=S.sessions.find(x=>x.id===ui.page.id);if(!s){ui.page=null;return vHome()+vTabs()}
  const ms=milestonesFor(s),segs=s.segments||[],span=segs.length?segs[segs.length-1][1]-segs[0][0]:0,pauses=Math.max(0,segs.length-1),sel=segs.length>1?ui.rp.seg:null;
  const order=S.sessions.slice().sort((a,b)=>a.start-b.start),idx=order.findIndex(x=>x.id===s.id),older=order[idx-1],newer=order[idx+1];
  const tl=segs.length?`<div class="tl" role="group" aria-label="Session timeline">${segs.map(([a,b],i)=>(i?`<span style="width:${((a-segs[i-1][1])/span*100).toFixed(2)}%"></span>`:"")+`<button style="width:${((b-a)/span*100).toFixed(2)}%" data-act="rSeg" data-i="${i}" aria-pressed="${sel===i}" aria-label="Part ${i+1}, ${fmtDur((b-a)/1e3)}"><i></i></button>`).join("")}</div>
     <div class="row between tiny"><span>${fmtTime(segs[0][0])}</span><span>${fmtTime(segs[segs.length-1][1])}</span></div>
     <p class="sub small" aria-live="polite">${sel!==null&&segs[sel]?`Part ${sel+1} of ${segs.length}: ${fmtTime(segs[sel][0])} to ${fmtTime(segs[sel][1])}, ${fmtDur((segs[sel][1]-segs[sel][0])/1e3)}.`:pauses?`${pauses} pause${pauses>1?"s":""}, ${fmtDur(span/1e3-s.durationSec)} paused in all. Tap a part to look closer.`:"One unbroken stretch, start to finish."}</p>`
    :`<p class="sub small">Logged by hand, so there's no timeline. Sessions you time get one.</p>`;
  /* comparisons: against your own history only */
  const sc=ui.rp.scope,pool=S.sessions.filter(x=>x.id!==s.id&&(sc==="all"||(sc==="cat"?x.category===s.category:x.start>=s.start-90*DAY&&x.start<=s.start+90*DAY)));
  const pst=stats(pool),wdPool=pool.filter(x=>new Date(x.start).getDay()===new Date(s.start).getDay()),wst=stats(wdPool);
  const pair=(label,a,b,bl)=>{const mx=Math.max(a,b,1);return`<div class="pair"><div class="row between small"><span class="sub">${label}</span><span><b>${fmtDur(a)}</b> <span class="sub">· ${bl} ${fmtDur(b)}</span></span></div><div class="bar"><i style="width:${a/mx*100}%"></i></div><div class="bar"><i style="width:${b/mx*100}%;background:var(--dim)"></i></div></div>`};
  const diff=s.durationSec-pst.avg,parts=[0,0,0,0];pool.forEach(x=>parts[partOf(new Date(x.start).getHours())]++);const usual=parts.indexOf(Math.max(...parts)),mine=partOf(new Date(s.start).getHours());
  const facts=[];if(older){const gap=Math.max(0,Math.round((startOfDay(s.start)-startOfDay(older.start))/DAY));facts.push(gap===0?"The same day as the one before":gap+" day"+(gap===1?"":"s")+" after the one before")}
  facts.push(`Session ${idx+1} of ${order.length}`);if(pool.length>=3)facts.push(usual===mine?`${PARTS[mine]} is when you most often start`:`You most often start in the ${PARTS[usual].toLowerCase()}; this was ${PARTS[mine].toLowerCase()}`);
  const cmp=pool.length?`${pair("This session",s.durationSec,pst.avg,"your average")}${wdPool.length>=2?pair("Against your "+WDL[new Date(s.start).getDay()]+"s",s.durationSec,wst.avg,"typical"):""}<p class="sub small">${Math.abs(diff)<45?"Right around your average.":fmtDur(Math.abs(diff))+(diff>0?" longer":" shorter")+" than your average. Neither is better; it's just where this one sat."}</p>`:`<p class="sub small">${sc==="all"?"Nothing to compare with yet. This fills in once you have more than one session.":"No other sessions match this filter."}</p>`;
  return hdr("Replay",`<button class="ib" data-act="editSession" data-id="${s.id}" aria-label="Edit session">${ic("edit")}</button>`)+`<div class="scroll">
   ${ui.page.fresh?`<div class="banner ok" role="status"><span>Saved privately.</span></div>`:""}${s.demo?`<div class="banner"><span>This is a demo session.</span></div>`:""}
   <div><h3>${fmtDate(s.start)} · ${fmtTime(s.start)}</h3><h1>${esc(s.title||"Session")}</h1></div>
   <div class="stage">${replayRing(s,sel)}<div class="in"><span class="sub small">Duration</span><div class="clock" style="font-size:48px">${fmtClock(s.durationSec)}</div><div class="row" style="gap:6px">${s.category?`<span class="pill c">${esc(catLabel(s))}</span>`:""}${s.mood?`<span class="pill" style="color:${MC[s.mood]||"var(--muted)"}">${esc(s.mood)}</span>`:""}</div></div></div>
   <h2>${esc(summaryFor(s))}</h2>
   <div class="sec"><h3>Timeline</h3>${tl}</div>
   ${ms.length?`<div class="card"><h3>Milestones from this one</h3><div>${ms.map(m=>`<div class="ach"><span class="badge on new">${m.g}</span><span class="grow"><b>${esc(m.t)}</b><span class="sub small" style="display:block">${esc(m.d)}</span></span></div>`).join("")}</div></div>`:""}
   <div class="card"><div class="row between"><h3>How it sits in your history</h3></div><div class="seg3" role="group" aria-label="Compare against">${[["all","All time"],["near","Around then"],["cat","Same category"]].map(([v,l])=>`<button data-act="rScope" data-v="${v}" aria-pressed="${sc===v}" ${v==="cat"&&!s.category?"disabled":""}>${l}</button>`).join("")}</div>${cmp}<ul class="plain">${facts.map(f=>`<li>${ic("clock")}<span>${esc(f)}.</span></li>`).join("")}</ul></div>
   ${peopleCard(s)}
   <div class="card"><h3>Reflection <span class="tiny" style="text-transform:none;letter-spacing:0">Optional, private</span></h3><div class="chips" role="group" aria-label="Mood">${MOODS.map(m=>`<button class="chip" data-act="rMood" data-v="${m}" aria-pressed="${s.mood===m}">${m}</button>`).join("")}</div><label class="f" for="rf-text">${RPROMPT[idx%3]}<textarea id="rf-text" maxlength="600" placeholder="A line or two, just for you.">${esc(s.reflection||"")}</textarea></label><button class="btn sm" style="align-self:flex-start" data-act="rSave">Save reflection</button></div>
   ${s.hrAvg||s.hrPeak?`<div class="card"><h3>Heart rate, as you entered it</h3><div class="trio">${s.hrAvg?`<div><b>${esc(s.hrAvg)}</b><span>average bpm</span></div>`:""}${s.hrPeak?`<div><b>${esc(s.hrPeak)}</b><span>peak bpm</span></div>`:""}</div><p class="tiny">A chart needs readings from a wearable, which the web build doesn't have.</p></div>`:""}
   ${s.tags.length||s.notes?`<div class="card line"><h3>Notes and tags</h3>${s.tags.length?`<div class="chips">${s.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>`:""}${s.notes?`<p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(s.notes)}</p>`:""}</div>`:""}
   <button class="btn ghost block" data-act="composeRecap" data-id="${s.id}">${ic("share")} Make a shareable card</button>
   <p class="tiny" style="text-align:center">A shareable card is a separate thing you build. It never carries your notes, reflection, mood, tags, heart rate or exact time.</p>
   <div class="row"><button class="btn sm ghost grow" data-act="openReplay" data-id="${older?older.id:""}" data-keep="1" ${older?"":"disabled"}>${ic("back")} Earlier</button><button class="btn sm ghost grow" data-act="openReplay" data-id="${newer?newer.id:""}" data-keep="1" ${newer?"":"disabled"}>Later ${ic("next")}</button></div></div>`}

function vHistory(){const all=sessions();return hdr("All sessions",`<button class="ib" data-act="manual" aria-label="Log a past session">${ic("plus")}</button>`)+`<div class="scroll">${demoBanner()}${all.length?`<div class="card"><div>${all.map(sessRow).join("")}</div></div>`:`<div class="card"><h2>No sessions yet.</h2><p class="sub">Start the timer or log one from memory.</p></div>`}</div>`}

function vAch(){const a=achievements(),g=S.settings.regular;return hdr("Achievements")+`<div class="scroll"><div><h1>Small wins, <em>kept quiet.</em></h1><p class="sub">These mark things that happened. They aren't targets, and nobody else sees them unless you share one.</p></div>
  <div class="card"><div>${a.map(x=>`<div class="ach"><span class="badge ${x.at?"on":""}">${x.g}</span><span class="grow"><b>${x.name}</b><span class="sub small" style="display:block">${esc(x.desc)}</span>${x.at?`<span class="tiny">Earned ${fmtDate(x.at.start)}</span>`:""}</span>${x.at&&S.settings.social?`<button class="btn sm ghost" data-act="composeAch" data-id="${x.id}">Share</button>`:""}</div>`).join("")}</div></div>

/* ---- insights ---- */
function insRange(){const r=ui.ins,now=Date.now();
  if(r.range==="week")return[startOfWeek(now),addDays(startOfWeek(now),7)];
  if(r.range==="month"){const d=new Date();return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()]}
  if(r.range==="year"){const y=new Date().getFullYear();return[new Date(y,0,1).getTime(),new Date(y+1,0,1).getTime()]}
  const f=r.from?new Date(r.from+"T00:00").getTime():NaN,t=r.to?new Date(r.to+"T00:00").getTime():NaN;
  if(isNaN(f)||isNaN(t)||t<f)return null;return[f,addDays(t,1)]}
function prevRange(rg){const r=ui.ins.range,d=new Date(rg[0]);if(r==="month")return[new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),rg[0]];if(r==="year")return[new Date(d.getFullYear()-1,0,1).getTime(),rg[0]];return[addDays(rg[0],-Math.round((rg[1]-rg[0])/DAY)),rg[0]]}
function vInsights(){const r=ui.ins,inCat=s=>r.cat==="all"||s.category===r.cat,base=S.sessions.filter(inCat),rg=insRange();

async function hashPin(pin,salt,alg){try{if(alg==="pbkdf2"){const k=await crypto.subtle.importKey("raw",te.encode(pin),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:te.encode(salt),iterations:150000},k,256))}
    return hex(await crypto.subtle.digest("SHA-256",te.encode(salt+":"+pin)))}catch(e){let x=5381;for(const c of te.encode(salt+":"+pin))x=((x<<5)+x+c)>>>0;return "f"+x.toString(16)}}
function demoSessions(){const out=[],base=startOfDay(Date.now()),plan=[[1,21,40,34,"partnered","Tender"],[3,7,15,18,"solo","Relaxed"],[6,22,30,41,"partnered","Electric"],[9,20,5,27,"partnered","Playful"],[12,23,10,22,"solo",""],[15,8,20,31,"partnered","Connected"],[19,21,0,48,"partnered","Tender"],[23,22,45,16,"solo","Curious"],[27,19,30,36,"partnered","Playful"],[33,10,0,29,"partnered","Relaxed"],[38,23,20,24,"solo",""],[45,21,15,39,"partnered","Electric"]];
  plan.forEach(([back,h,m,dur,cat,mood],i)=>{const st=addDays(base,-back)+h*36e5+m*6e4,d=dur*60+((i*17)%50);out.push({id:"demo"+i,demo:true,title:"",start:st,durationSec:d,segments:i%3?[[st,st+d*1e3]]:[[st,st+d*400],[st+d*400+18e4,st+d*1e3+18e4]],category:cat,tags:i%4===0?["weekend"]:[],mood,notes:"",reflection:i===0?"Demo reflection: an unhurried evening.":"",hrAvg:i%2?"":String(96+i*2),hrPeak:i%2?"":String(128+i*3),createdAt:st,updatedAt:st})});return out}
