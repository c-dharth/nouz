<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. A coral ring is the recurring object: the week on Home, the session in Replay, the clock in Insights. Cards are used only where content needs a container. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0E0B0C; --surface:#1B1718; --surface2:#272123; --line:#3A3133;
  --coral:#C9939B; --pink:#E8CBC6; --text:#F3ECE3; --muted:#BCAFA9; --dim:#988A86;
  --wine:#8C2A43; --burgundy:#561727; --ink:#1C1114;
  --ok:#93C9AA; --warn:#E2BA7C; --danger:#E5867A;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --body:"Schibsted Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:22px; --r-sm:14px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
.scroll:focus{outline:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media(min-width:520px){body{background:#08080b}#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 28px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;border-top:1px solid var(--line);background:rgba(14,11,12,.96);padding:0 6px env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.02em;position:relative;transition:color .15s}
.tab::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--coral);transform:scaleX(0);transition:transform .2s}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{transform:scaleX(1)}
.tab[aria-current="page"] svg{color:var(--coral)}
.tab svg{width:23px;height:23px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mark{font-family:var(--display);font-style:italic;font-size:30px;line-height:1;letter-spacing:-.01em}
.mark b{color:var(--coral);font-weight:400}
h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em{color:var(--pink)}
h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.12;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
p.sub,.sub{color:var(--muted)}
.small{font-size:13px}.tiny{font-size:12px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.line{background:none;border:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.row:first-child{align-items:baseline}
.rule{height:1px;background:var(--line);border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--surface2);color:var(--text);transition:transform .12s,background .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--wine),var(--burgundy));color:var(--text);box-shadow:inset 0 0 0 1px rgba(232,203,198,.14)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid rgba(229,134,122,.5);color:var(--danger)}
.btn.sm{min-height:44px;padding:0 16px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.busy{opacity:.6;pointer-events:none}
.link{color:var(--pink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(232,203,198,.4);min-height:44px;display:inline-flex;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border-radius:var(--r-sm);padding:14px 12px;min-width:0}
.tile b{display:block;font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio div{padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.trio div:first-child{border-left:0;padding-left:0}
.trio b{display:block;font-family:var(--display);font-weight:400;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.trio span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal span.h{color:var(--dim);font-weight:700;aspect-ratio:auto;padding-bottom:2px}
.cal span.on{background:rgba(201,147,155,.2);color:var(--text);font-weight:700}
.cal span.on2{background:var(--coral);color:#1C1114;font-weight:700}
.cal span.today{box-shadow:inset 0 0 0 1.5px var(--pink)}
.sess{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:60px;border-top:1px solid var(--line);width:100%;text-align:left}
.sess:first-of-type{border-top:0}
.sess .d{width:44px;text-align:center;flex:none}
.sess .d b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.sess .d span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sess .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
button.pill{min-height:44px;padding:0 14px}
.pill.c{background:rgba(201,147,155,.16);color:var(--pink)}
.pill.w{background:rgba(226,186,124,.14);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--coral);color:#1C1114}
.seg3{display:flex;background:var(--surface);border-radius:999px;padding:4px}
.seg3 button{flex:1;min-height:40px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
label.f em{font-style:normal;font-weight:500;color:var(--dim);letter-spacing:0}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],input[type=password],textarea{width:100%;min-height:48px;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);padding:12px 14px;font-size:16px;font-weight:500;color:var(--text);letter-spacing:0}
input:focus,textarea:focus{outline:none;border-color:var(--coral)}
textarea{min-height:84px;resize:vertical}
.sw{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;min-height:48px;width:100%;text-align:left}
.sw .k{width:46px;height:28px;border-radius:999px;background:var(--surface2);position:relative;flex:none;transition:background .15s}
.sw .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"] .k{background:var(--coral)}
.sw[aria-checked="true"] .k::after{transform:translateX(18px);background:#1C1114}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 2px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.ib.bare{background:none}
.clock{font-size:54px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stage{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stage .in{position:relative;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stage [data-act]{cursor:pointer}
.stage g:focus-visible{outline:none}
.stage g:focus-visible path.vis{stroke:var(--text)}
.orb{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 35% 30%,#B0475F,var(--burgundy) 72%);color:var(--text);font-weight:800;box-shadow:0 0 0 10px rgba(201,147,155,.08),0 18px 50px rgba(201,147,155,.28);transition:transform .15s}
.orb:active{transform:scale(.96)}
.orb svg{width:38px;height:38px}
.orb.dark{background:var(--surface);color:var(--text);box-shadow:0 0 0 10px rgba(201,147,155,.08)}
.orb .mc{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.live .glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.enter .scroll>*,.enter .ob>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.enter .scroll>*:nth-child(2){animation-delay:.04s}.enter .scroll>*:nth-child(3){animation-delay:.08s}.enter .scroll>*:nth-child(4){animation-delay:.12s}.enter .scroll>*:nth-child(5){animation-delay:.16s}.enter .scroll>*:nth-child(n+6){animation-delay:.2s}
.enter path.seg{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s .15s cubic-bezier(.3,.7,.2,1) forwards}
.enter .badge.on.new{animation:pop .5s .5s both}
.overlay.in{animation:fade .2s both}.overlay.in .sheet{animation:up .28s cubic-bezier(.2,.7,.2,1) both}
.toast{animation:rise .25s both}
.skel{border-radius:var(--r);height:150px;background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 100px,var(--surface) 200px);background-size:400px 100%;animation:shimmer 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.overlay{position:absolute;inset:0;background:rgba(5,5,8,.72);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet:focus{outline:none}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--text);color:#15131c;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:30;text-align:center}
.banner{background:rgba(226,186,124,.12);color:var(--warn);border-radius:var(--r-sm);padding:6px 14px;min-height:44px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.ok{background:rgba(147,201,170,.12);color:var(--ok)}
.ob{flex:1;display:flex;flex-direction:column;padding:26px 24px calc(22px + env(safe-area-inset-bottom));gap:18px;overflow-y:auto}
.ob .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.steps{display:flex;gap:5px}.steps i{height:3px;flex:1;border-radius:3px;background:var(--surface2)}.steps i.on{background:var(--coral)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-sm);border:1.5px solid var(--line);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--coral);background:rgba(201,147,155,.08)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt b{display:block}
.share{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;color:#1C1114}
.share.s0{background:linear-gradient(140deg,#8C2A43,#3E1019);color:var(--text)}
.share.s1{background:linear-gradient(150deg,#3A1621,#1B1718);color:var(--text);box-shadow:inset 0 0 0 1px #5E2A37}
.share.s2{background:linear-gradient(140deg,#E8CBC6,#F3ECE3)}
.share.s3{background:#0E0B0C;color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--coral)}
.share svg.deco{position:absolute;right:-46px;top:-46px;width:190px;height:190px;opacity:.28}
.share .big{position:relative;font-family:var(--display);font-size:34px;line-height:1.02;overflow-wrap:anywhere;max-width:85%}
.share .meta{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13px}
.share .meta span{padding:4px 10px;border-radius:999px;background:rgba(26,8,16,.14)}
.share.s1 .meta span,.share.s3 .meta span{background:rgba(232,203,198,.16);color:var(--pink)}
.share .wm{font-family:var(--display);font-style:italic;font-size:20px;opacity:.8}
.post{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--pink);flex:none}
.rx{display:flex;gap:6px;flex-wrap:wrap}
.rx button{min-height:44px;min-width:52px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;transition:transform .12s,background .15s}
.rx button:active{transform:scale(1.15)}
.rx button[aria-pressed="true"]{background:rgba(201,147,155,.22);color:var(--text)}
.cm{font-size:14px;padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.cm b{color:var(--pink)}
.ach{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ach:first-of-type{border-top:0}
.badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--dim);font-family:var(--display);font-style:italic;font-size:22px;flex:none}
.badge.on{background:linear-gradient(140deg,#8C2A43,#4A1622);color:var(--pink)}
.badge svg{width:22px;height:22px}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .b{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.hs .b.on{color:var(--text)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.hm i.l1{background:rgba(201,147,155,.35)}.hm i.l2{background:rgba(201,147,155,.65)}.hm i.l3{background:var(--coral)}.hm i.f{opacity:.25}
.grid74{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;align-items:center;font-size:11px;color:var(--dim);font-weight:600}
.grid74 i{aspect-ratio:1.5;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--text);font-variant-numeric:tabular-nums}
.grid74 span{text-align:center}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.bar i{background:var(--coral)}.bar i.p{background:transparent}
.tl{display:flex;height:44px;align-items:center}
.tl button{height:44px;display:flex;align-items:center;padding:0;min-width:6px}
.tl button i{display:block;width:100%;height:14px;border-radius:7px;background:var(--coral);opacity:.55;transition:opacity .15s,height .15s}
.tl button[aria-pressed="true"] i{opacity:1;height:22px;border-radius:11px}
.tl span{height:2px;background:var(--line)}
.pair{display:flex;flex-direction:column;gap:5px}
.pair .bar{height:8px}
.hb{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .bar{height:10px}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.pin{letter-spacing:.5em;text-align:center;font-size:24px!important}
ul.plain{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
ul.plain li svg{color:var(--coral);margin-top:2px}
ul.plain li.p svg{color:var(--warn)}

/* ---- added: couples features ---- */
.stepper{display:flex;align-items:center;justify-content:center;gap:16px}
.stepper .ib{font-size:24px;font-weight:500;background:var(--surface2)}
.stepper .ib[disabled]{opacity:.35}
.stepper span{min-width:160px;text-align:center;color:var(--muted)}
.stepper b{font-family:var(--display);font-size:32px;font-weight:400;color:var(--text);vertical-align:-4px;margin-right:4px}
.pill.ok{background:rgba(147,201,170,.14);color:var(--ok)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:var(--surface);border-radius:var(--r-sm);min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);transition:transform .12s,background .15s}
.qa button:active{transform:scale(.97);background:var(--surface2)}
.qa svg{width:24px;height:24px;color:var(--coral)}
.card.rowcard{flex-direction:row;align-items:center;gap:12px;text-align:left;width:100%}
.card.idea{gap:10px;background:linear-gradient(160deg,var(--surface),#1F1517)}
.idea .it{font-family:var(--display);font-size:23px;font-weight:400;line-height:1.15;display:block;margin-bottom:2px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;min-height:60px;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick[disabled]{opacity:.45}
.steps-l{margin:8px 0 0 18px;padding:0;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.pick .tick{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none;transition:background .15s,color .15s}
.pick[aria-pressed="true"] .tick{background:var(--wine);color:var(--text)}
.pick[aria-pressed="true"] b{color:var(--pink)}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ib{position:absolute;top:4px;right:4px;width:40px;height:40px;background:rgba(14,11,12,.78)}
.ph.sm{width:46px;height:46px;flex:none;border-radius:12px}
.ph.gone img{visibility:hidden}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{cursor:pointer}
label.btn:focus-within{outline:2px solid var(--pink);outline-offset:2px}
.chips.sm{gap:6px}.chips.sm .chip{padding:0 13px;font-size:12px}
details.filt summary{display:flex;justify-content:space-between;align-items:center;min-height:44px;cursor:pointer;list-style:none}
details.filt summary::-webkit-details-marker{display:none}
.mark b{color:var(--wine)}
h1 em,h2 em{color:var(--coral)}
/* ---- rewards ---- */
.card.prog{text-align:left;width:100%;gap:8px}
.vp{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--text)}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const DAY=864e5, WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const startOfWeek=t=>{const d=new Date(startOfDay(t));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const fmtClock=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+"h "+pad(m)+"m":m?m+"m"+(x&&m<10?" "+x+"s":""):x+"s"};
const fmtMin=s=>{const m=s/60;return m>=10?Math.round(m):Math.round(m*10)/10};
const fmtDate=t=>{const d=new Date(t);return WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()]};
const fmtTime=t=>{const d=new Date(t);let h=d.getHours();const a=h<12?"am":"pm";h=h%12||12;return h+":"+pad(d.getMinutes())+a};
const toLocalInput=t=>{const d=new Date(t);return dayKey(t)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const reduced=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return true}};
const PARTS=["Morning","Afternoon","Evening","Night"],PARTH=["5am to noon","noon to 5pm","5pm to 10pm","10pm to 5am"];
const partOf=h=>h>=5&&h<12?0:h>=12&&h<17?1:h>=17&&h<22?2:3;
const IC={heart:'<path d="M12 20s-7.5-4.6-9.2-9.3C1.7 7.5 3.8 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.2 0 5.3 3 4.2 6.2C19.5 15.4 12 20 12 20z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>',photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',track:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.6 5.2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/>',play:'<path d="M8 4.5v15l12-7.5z" fill="currentColor"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',next:'<path d="M9 5l7 7-7 7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',edit:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',share:'<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',dots:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',watch:'<rect x="6.5" y="6" width="11" height="12" rx="3"/><path d="M9 6l.6-3.5h4.8L15 6M9 18l.6 3.5h4.8L15 18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';

/* ============ private store (this device, not encrypted by VOUZ) ============ */
const LS="vouz.v1"; let storageOK=true;
const fresh=()=>({v:1,onboarded:false,stamp:0,lastSync:0,syncBase:0,user:{name:"",mode:"local",createdAt:Date.now()},settings:{social:false,privateProfile:true,defaultVis:"connections",regular:null,pinHash:null,pinSalt:null,pinAlg:null,pinFails:0,pinUntil:0,games:true,celebrate:true,goal:null,chPrefs:{budget:null,interests:[],lowEnergy:false,shortTime:false}},rewards:{spent:[],unlocked:[],cards:[],ch:{},theme:null,frame:null,seen:null,seenB:[],seenL:1},sessions:[],exps:[],picks:{},psi:{},consent:{req:[],ans:{}},deleted:{},active:null,draft:null,blocks:[],ignored:[],keys:null});
function load(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.v===1)return Object.assign(fresh(),o,{settings:Object.assign(fresh().settings,o.settings)})}}catch(e){storageOK=false}return fresh()}
let S=load();
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){storageOK=false}}
function save(){S.stamp=Date.now();saveLocal();Cloud.queueVault()}
/* What sync and export carry: never demo rows, never social keys. */
/* Photos are not in here: they stay on the device. */
const vaultPayload=()=>({v:1,stamp:S.stamp,user:S.user,settings:S.settings,sessions:S.sessions.filter(s=>!s.demo),exps:S.exps.filter(e=>!e.demo).map(e=>({...e,photos:[]})),picks:S.picks,psi:S.psi,rewards:S.rewards,consent:S.consent,deleted:S.deleted,blocks:S.blocks,ignored:S.ignored});
/* Two devices: keep the newer copy of each session, honour deletions from either side. */
function mergeVault(v){const del=Object.assign({},v.deleted||{});for(const k in S.deleted)del[k]=Math.max(del[k]||0,S.deleted[k]);
  const m={};for(const s of (v.sessions||[]).concat(S.sessions)){const c=m[s.id];if(!c||(s.updatedAt||0)>(c.updatedAt||0))m[s.id]=s}
  S.sessions=Object.values(m).filter(s=>!(del[s.id]>=(s.updatedAt||0)));S.deleted=del;
  /* Experiences merge the same way. A copy from another device has no photos, so keep this device's photo list. */
  const mx={};for(const e of (v.exps||[]).concat(S.exps||[])){const c=mx[e.id];if(!c||(e.updatedAt||0)>(c.updatedAt||0))mx[e.id]=Object.assign({},e,{photos:(c&&c.photos&&c.photos.length?c.photos:e.photos)||[]})}
  const local=Object.fromEntries((S.exps||[]).map(e=>[e.id,e]));S.exps=Object.values(mx).filter(e=>!(del[e.id]>=(e.updatedAt||0))).map(e=>local[e.id]&&local[e.id].photos&&local[e.id].photos.length?{...e,photos:local[e.id].photos}:e);
  if((v.stamp||0)>S.stamp&&v.picks){S.picks=v.picks;S.psi=v.psi||{}}
  if(v.rewards)S.rewards=mergeRewards(S.rewards,v.rewards);
  if(v.consent){const by={};for(const r of (v.consent.req||[]).concat((S.consent||{}).req||[]))by[r.id]=r;S.consent={req:Object.values(by),ans:{...(v.consent.ans||{}),...((S.consent||{}).ans||{})}}}
  normCats();
  if((v.stamp||0)>S.stamp){S.settings=Object.assign(fresh().settings,v.settings);S.blocks=v.blocks||[];S.ignored=v.ignored||[];S.user=Object.assign({},v.user,{mode:"account"})}}

/* ============ optional cloud: private account space ============ */
const Cloud={db:null,user:null,uid:null,state:"checking",t:null,busy:false,dirty:false,
  async init(){try{if(!window.claude||!window.claude.use){this.state="none";return}
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      const id=user?await user.id():null;
      if(!db||!id){this.state="none";return}
      this.db=db;this.user=user;this.uid=id;this.state="ready";
    }catch(e){this.state="none"}},
  priv(name){return this.db.doc("data/users/"+this.uid+"/"+name)},
  queueVault(){if(this.state!=="ready"||S.user.mode!=="account"||!S.onboarded)return;clearTimeout(this.t);this.t=setTimeout(()=>this.pushVault(),1200)},
  async pushVault(){if(this.busy){this.dirty=true;return}this.busy=true;
    try{const json=JSON.stringify(vaultPayload());
      if(json.length>240000)toast("Account sync is full. Your data is still saved on this device.");
      else{const v=await this.readVault();
        if(v&&v.stamp!==S.syncBase){mergeVault(v);S.stamp=Date.now();saveLocal();if(!typing()&&!ui.sheet)render()}
        await this.priv("vault").set({json:JSON.stringify(vaultPayload()),stamp:S.stamp});S.syncBase=S.stamp;S.lastSync=Date.now();saveLocal()}}
    catch(e){toast("Account sync failed. Your data is still saved on this device.")}
    this.busy=false;if(this.dirty){this.dirty=false;this.pushVault()}},
  async readVault(){try{const s=await this.priv("vault").get();if(s.exists){const o=JSON.parse(s.data().json);if(o&&o.v===1)return o}}catch(e){}return null},
  async deleteAll(){if(this.state!=="ready")return;const ps=["vault","keys","stash"].map(n=>this.priv(n).delete());
    for(const c of ["profiles","posts","reactions","comments","links","invites","spaces","exps","match","consent","reports"])ps.push(this.db.doc(c+"/"+this.uid).delete());
    await Promise.allSettled(ps)}
};

/* ============ keys: connections-only content is encrypted in the browser ============ */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s="";new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>Array.from(new Uint8Array(u)).map(b=>b.toString(16).padStart(2,"0")).join("");
const cat=(a,s)=>{const t=te.encode(s),o=new Uint8Array(a.length+t.length);o.set(a);o.set(t,a.length);return o};
const K={ok:!!(window.crypto&&crypto.subtle),priv:null,self:null,pairs:{},
  async gen(){const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);
    return{pub:await crypto.subtle.exportKey("jwk",kp.publicKey),priv:await crypto.subtle.exportKey("jwk",kp.privateKey),self:b64(crypto.getRandomValues(new Uint8Array(32)))}},
  async load(k){this.priv=await crypto.subtle.importKey("jwk",k.priv,{name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);this.self=await this.aes(ub64(k.self));this.pairs={}},
  reset(){this.priv=null;this.self=null;this.pairs={}},
  aes(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"])},
  /* A shared secret with one other person. out/in are one-way labels only the two of us can compute, so stored lists don't reveal who is connected to whom. */
  async pair(id,pubJwk){const ck=id+"|"+pubJwk.x+pubJwk.y;if(this.pairs[ck])return this.pairs[ck];
    const pub=await crypto.subtle.importKey("jwk",pubJwk,{name:"ECDH",namedCurve:"P-256"},false,[]);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:pub},this.priv,256));
    const h=async l=>new Uint8Array(await crypto.subtle.digest("SHA-256",cat(bits,l)));
    return this.pairs[ck]={out:hex(await h("|"+Cloud.uid+">"+id)).slice(0,32),in:hex(await h("|"+id+">"+Cloud.uid)).slice(0,32),key:await this.aes(await h("|vouz-wrap"))}},
  async enc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes)),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)},
  async dec(key,s){const u=ub64(s);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12)))},
  encJ(key,o){return this.enc(key,te.encode(JSON.stringify(o)))},
  async decJ(key,s){return JSON.parse(td.decode(await this.dec(key,s)))},
  async thread(raw){return hex(await crypto.subtle.digest("SHA-256",cat(raw,"|vouz-thread"))).slice(0,24)}
};

/* ============ social data-access layer ============
   Shared storage holds: profiles (handle + public key), posts, reactions, comments, links.
   "Everyone" cards are stored readable. Connections-only cards are stored as ciphertext with one wrapped key per
   permitted recipient; reconcile() is the single place that decides who gets a key. No key, no card. */
const SHARED=["profiles","posts","reactions","comments","links","invites","spaces","exps","match","consent"];
const Soc={profiles:{},posts:{},reactions:{},comments:{},links:{},invites:{},spaces:{},exps:{},match:{},consent:{},creq:[],cans:{},inbox:[],inv:{},invSig:"",rel:{},items:[],cm:{},perms:{},cache:{},au:{},subs:[],status:"off",wq:{},t:null,busy:false,again:false,
  async ensureKeys(){if(!S.keys){const d=await Cloud.priv("keys").get();if(d.exists)S.keys=JSON.parse(d.data().json);else{S.keys=await K.gen();await Cloud.priv("keys").set({json:JSON.stringify(S.keys)})}saveLocal()}
    if(!K.priv)await K.load(S.keys)},
  async start(){if(this.subs.length||Cloud.state!=="ready"||!K.ok)return;this.status="loading";
    try{await this.ensureKeys()}catch(e){this.status="error";return}
    const timer=setTimeout(()=>{if(this.status==="loading"){this.status="slow";render()}},10000);
    for(const c of SHARED)this.subs.push(Cloud.db.collection(c).onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()||{}});this[c]=m;if(c==="posts")clearTimeout(timer);this.sched()},()=>{clearTimeout(timer);this.status="error";render()}))},
  stop(){this.subs.forEach(u=>{try{u()}catch(e){}});this.subs=[];this.status="off";clearTimeout(this.t);for(const c of SHARED)this[c]={};this.inbox=[];this.inv={};this.invSig="";this.sp={};this.shared=[];this.mres={};this.mdocs={};this.creq=[];this.cans={};this.pubSig="";this.rel={};this.items=[];this.cm={};this.perms={};this.cache={};this.au={}},
  sched(){clearTimeout(this.t);this.t=setTimeout(async()=>{if(this.busy){this.again=true;return}this.busy=true;
    try{await this.recompute()}catch(e){}this.busy=false;if(this.status==="loading"||this.status==="slow")this.status="ready";
    const sig=JSON.stringify([this.inbox.map(x=>x.a+x.i),this.inv,Object.values(this.sp).map(x=>[x.id,x.role,x.name,x.members,x.invited]),this.shared.map(x=>x.id+x.updatedAt),this.mres,this.creq.map(r=>r.id),this.cans]),moved=sig!==this.invSig;this.invSig=sig;
    if((ui.tab==="social"||ui.tab==="profile"||ui.page&&ui.page.type==="compose"||moved)&&!typing())render();
    if(this.again){this.again=false;this.sched()}},40)},
  write(coll,data){this[coll]=Object.assign({},this[coll]);if(data===null)delete this[coll][Cloud.uid];else this[coll][Cloud.uid]=data;
    const ref=Cloud.db.doc(coll+"/"+Cloud.uid);
    this.wq[coll]=(this.wq[coll]||Promise.resolve()).then(()=>data===null?ref.delete():ref.set(data)).catch(e=>{toast(e&&e.code==="invalid_argument"?"You have view-only access here, so Social can't save.":"Social couldn't save that. Try again.")});
    this.sched();return this.wq[coll]},
  me(){return this.profiles[Cloud.uid]},
  handle(id){const p=this.profiles[id];return p&&p.handle?p.handle:"Someone"},

function achievements(){
  const ss=S.sessions.slice().sort((a,b)=>a.start-b.start),u={};
  const first=f=>ss.find(f);
  if(ss[0])u.first=ss[0]; if(ss[1])u.double=ss[1]; if(ss[9])u.ten=ss[9];
  u.owl=first(s=>{const h=new Date(s.start).getHours();return h>=22||h<4});
  u.early=first(s=>{const h=new Date(s.start).getHours();return h>=5&&h<9});
  u.weekend=first(s=>[0,6].includes(new Date(s.start).getDay()));
  u.story=first(s=>(s.notes&&s.notes.trim())||(s.reflection&&s.reflection.trim()));
  let cum=0;for(const s of ss){cum+=s.durationSec;if(cum>=6000){u.century=s;break}}
  const g=S.settings.regular;
  if(g){const wk={};ss.forEach(s=>{const k=startOfWeek(s.start);(wk[k]=wk[k]||[]).push(s)});
    const keys=Object.keys(wk).map(Number).sort((a,b)=>a-b);let run=0,prev=null;
    for(const k of keys){const ok=wk[k].length>=g.perWeek;
      if(ok){run=(prev!==null&&Math.round((k-prev)/DAY)===7)?run+1:1;prev=k;if(run>=g.weeks){u.regular=wk[k][g.perWeek-1];break}}else{run=0;prev=null}}}

}

  vals.forEach((v,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="${i===n-1?"#C9939B":"#E8CBC6"}"><title>${esc(labels[i])}: ${v} ${unit}</title></circle>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(aria)}">${g}</svg>`}
function heatmap(list,weeks){const m=countByDay(list),end=addDays(startOfWeek(Date.now()),6),start=addDays(end,-(weeks*7-1));let h="";
  for(let t=start,i=0;i<weeks*7;i++,t=addDays(t,1)){const c=m[dayKey(t)]||0;h+=`<i class="${c?"l"+Math.min(3,c):""}${t>Date.now()?" f":""}" title="${fmtDate(t)}: ${c} session${c===1?"":"s"}"></i>`}
  return`<div class="hm" style="grid-template-columns:repeat(${weeks},1fr)">${h}</div>`}
/* Insights: a 24-hour dial, midnight at the top, one spoke per starting hour. */
function dial(list){const cx=150,cy=150,r0=50,r1=112,by=Array(24).fill(0);list.forEach(s=>by[new Date(s.start).getHours()]++);const max=Math.max(1,...by);
  let g=`<circle cx="${cx}" cy="${cy}" r="${r0-8}" fill="none" stroke="#3A3133"/><circle cx="${cx}" cy="${cy}" r="${r1+4}" fill="none" stroke="#3A3133" stroke-dasharray="2 5"/>`;
  by.forEach((c,h)=>{const a=h*15+7.5,[x0,y0]=polar(cx,cy,r0,a),[x1,y1]=polar(cx,cy,r0+(r1-r0)*(c/max),a);
    g+=c?`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="url(#rg)" stroke-width="9" stroke-linecap="round"><title>${h%12||12}${h<12?"am":"pm"}: ${c} session${c===1?"":"s"}</title></line>`:`<circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="2" fill="#3A3133"/>`});
  [["12am",0],["6am",90],["12pm",180],["6pm",270]].forEach(([l,a])=>{const [x,y]=polar(cx,cy,r1+24,a);g+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#BCAFA9">${l}</text>`});
  return`<svg viewBox="0 0 300 300" width="100%" style="max-width:300px;align-self:center" role="img" aria-label="Sessions by starting hour">${GRAD}${g}</svg>`}
const MC={Playful:"#C9939B",Tender:"#E8CBC6",Electric:"#E2BA7C",Relaxed:"#93C9AA",Connected:"#A99CC4",Curious:"#8FB2C6"};

function countUp(){if(reduced())return;document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count;if(!(to>0))return;const t0=performance.now();
  const f=t=>{const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=Number.isInteger(to)?Math.round(to*e):(to*e).toFixed(1);if(p<1&&el.isConnected)requestAnimationFrame(f);else el.textContent=to};requestAnimationFrame(f)})}
const vTabs=()=>`<nav class="tabs" aria-label="Primary">${TABS().map(([id,l,i])=>`<button class="tab" data-act="tab" data-tab="${id}" ${ui.tab===id?'aria-current="page"':""}>${ic(i)}${l}</button>`).join("")}</nav>`;

     ${o.restore?`<div class="banner ok"><span>Found ${o.restore.sessions.length} synced session${o.restore.sessions.length===1?"":"s"} on your account.</span><button class="link" data-act="obRestore">Restore</button></div>`:""}
     ${sw("obSocial",o.social,"Turn on Social",Cloud.state==="ready"?"Off by default. Everything else works the same without it.":"Not available in this view, so it stays off.",Cloud.state!=="ready"?"disabled":"")}
     <label class="f" for="ob-name">What should we call you? <em>Optional</em><input type="text" id="ob-name" data-bind="ob.name" maxlength="30" value="${esc(o.name)}" autocomplete="off"></label>

   ${pp.length?`<div>${pp.map(p=>{const st=p.from?"Logged it; you confirmed":on?PST[Soc.inv[p.id+"|"+p.i]||"wait"]:"Connections are off";return`<div class="ach"><span class="av" aria-hidden="true">${esc((p.h||"?")[0].toUpperCase())}</span><span class="grow"><b>${esc(on?Soc.handle(p.id)==="Someone"?p.h:Soc.handle(p.id):p.h)}</b><span class="sub small" style="display:block">${st}</span></span><button class="btn sm ghost" data-act="personOff" data-sid="${s.id}" data-i="${esc(p.i)}" aria-label="Remove ${esc(p.h)} from this session">Remove</button></div>`}).join("")}</div>`:`<p class="sub small">Self-reported. You can invite the other person or people to confirm it, and they decide.</p>`}

   "Poly" names a kind of session, not anyone's relationship. */
const CATS={couple:"Couple",poly:"Poly"},CAT_PICK=["couple","poly"],CAT_ALL=["couple","poly"],PMAX=20;
const CATC={couple:"var(--coral)",poly:"#C9A27E"};
const clampP=n=>Math.min(PMAX,Math.max(3,Math.round(+n)||3));

const LEGACY=["solo","partnered"];
function convCat(c,n){if(c==="couple"||c==="duo")return{category:"couple",participants:2};if(c==="poly")return{category:"poly",participants:clampP(n)};

  for(const a of [S.active,S.draft])if(a&&a.category&&!LEGACY.includes(a.category)){const c=convCat(a.category,a.participants??a.groupSize);a.category=c.category;a.participants=c.participants;delete a.groupSize}
  for(const a of [S.active,S.draft])if(a&&LEGACY.includes(a.category)){a.category="couple";a.participants=2}}
const legacySessions=()=>S.sessions.filter(s=>!s.demo&&LEGACY.includes(s.category));

/* ---- replay ---- */
const RPROMPT=["What do you want to remember about this one?","What made this one what it was?","Anything you'd tell your future self?"];
function vReplay(){const s=S.sessions.find(x=>x.id===ui.page.id);if(!s){ui.page=null;return vHome()+vTabs()}

function vPolicy(){const li=(a,cls="")=>a.map(t=>`<li class="${cls}">${ic(cls?"flag":"check")}<span>${t}</span></li>`).join("");
  return hdr("Privacy and this build")+`<div class="scroll">
  <div class="card"><h3>What is stored, and where</h3><ul class="plain">${li(["<b style='color:var(--text)'>Sessions, notes, reflections, moods, tags, heart rate, settings:</b> this browser's storage, as plain data. With account sync on, one extra copy in a private space only your signed-in account can read.","<b style='color:var(--text)'>Social, readable by people in this space:</b> your handle, a public key, cards you marked for everyone, reactions and comments on those, and when you posted.","<b style='color:var(--text)'>Social, encrypted:</b> connections-only cards, their comments, who each card is for, your connection permissions. Your connection list is stored as labels only you and the other person can match.","<b style='color:var(--text)'>Never collected:</b> location, contacts, device identifiers, advertising or analytics events. VOUZ sends no notifications and has no widgets."])}</ul></div>
  <div class="card"><h3>Retention and deletion</h3><p class="sub small">Data stays until you delete it. Deleting a session removes it at once and the deletion carries to your other synced devices. Turning Social off deletes your profile and moves your cards, comments, reactions and connections out of shared storage into your private space, so nothing of yours is left for others to read; turning it back on restores them, or you can delete them instead. Deleting your account erases this device's data, your synced copy, your keys and everything you shared.</p></div>
  <div class="card"><h3>Built and working</h3><ul class="plain">${li(["Timer, manual logging, edit, delete, history","Adding connections to a saved session, by invite they accept or decline","Home week ring, calendar, totals","Replay with timeline, history comparisons and private reflections","Insights: overview, time-of-day and weekday patterns, mood","Achievements, including one you define","Optional Social: two-sided connections, per-card audiences, reactions, comments, block, report","Connections-only cards encrypted per recipient; access removed when you disconnect, block or change a permission","Private account sync with merge across devices","Export, import, passcode screen lock, account deletion"])}</ul></div>
  <div class="card line"><h3>Planned, not built</h3><ul class="plain">${li(["Native iOS app, Apple Watch and HealthKit heart rate","Face ID or fingerprint unlock","Encryption of data stored on the device","Public-scale Social with automated moderation","Payments and VOUZ Plus","Offline install as an app"],"p")}</ul></div>
  <div class="card line"><h3>Limits worth knowing</h3><ul class="plain">${li(["Social runs among the people this page has been shared with, not the public.","Encryption hides what a connections-only card says and who it's for. It doesn't hide that you posted something, when, or how many people can open it.","Someone who could already open a card may have kept a copy before you removed their access.","Your keys live in this browser and in your private account space. Whoever controls this page's code is trusted not to change it.","The space owner can remove shared content and reads reports. That is the moderation path.","A browser can clear its storage. Export a backup, or use account sync."],"p")}</ul></div></div>`}

function vSheet(isNew){const s=ui.sheet,close=`<button class="btn ghost block" data-act="closeSheet">Cancel</button>`;let b="";
  if(s.type==="confirm")b=`<h2>${esc(s.title)}</h2><p class="sub">${esc(s.body)}</p><button class="btn ${s.danger?"danger":"primary"} block" data-act="confirmYes">${esc(s.yes)}</button>${close}`;
  else if(s.type==="chDone"){const c=RW.CH[s.cid],w=RW.week(Date.now()),all=S.exps.filter(x=>!x.demo&&x.kind==="done"),ok=all.filter(e=>RW.week(e.createdAt||e.date)===w&&RW.qualifies(c,e,all));
    b=`<h2>${esc(c.t)}</h2><p class="sub small">Choose the memory from this week that completes it.</p>${ok.length?`<div>${ok.map(e=>`<button class="pick" data-act="chPick" data-v="${e.id}" aria-pressed="${s.exp===e.id}"><span class="grow"><b>${esc(e.title)}</b><span class="sub small" style="display:block">${fmtDate(e.date)} · ${XCATS[e.cat]}${e.location?" · "+esc(e.location):""}</span></span><span class="tick" aria-hidden="true">${ic(s.exp===e.id?"check":"plus")}</span></button>`).join("")}</div>`:`<p class="sub">Nothing from this week fits yet${c.kinds?": it needs to be "+c.kinds.map(k=>XCATS[k].toLowerCase()).join(" or "):""}${c.newPlace?", at a place you haven't logged before":""}.</p><button class="btn sm" data-act="expNew" data-kind="done">${ic("plus")} Add a memory</button>`}
    ${c.attest?sw("chAttest",s.attest,c.attest):""}${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="chSave" ${s.exp?"":"disabled"}>Complete for ${RW.VP.challenge} VP</button>${close}`}
  else if(s.type==="mcard"){const miles=S.exps.filter(e=>!e.demo&&e.kind==="done"&&e.cat==="milestone");
    b=`<h2>Milestone keepsake card</h2><p class="sub small">Choose the milestone to make into a card. It costs ${RWD.mcard.cost} VP.</p><div>${miles.map(e=>`<button class="pick" data-act="mcPick" data-v="${e.id}" aria-pressed="${s.exp===e.id}"><span class="grow"><b>${esc(e.title)}</b><span class="sub small" style="display:block">${fmtDate(e.date)} ${new Date(e.date).getFullYear()}</span></span><span class="tick" aria-hidden="true">${ic(s.exp===e.id?"check":"plus")}</span></button>`).join("")}</div>${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="mcSave" ${s.exp?"":"disabled"}>Redeem for ${RWD.mcard.cost} VP</button>${close}`}
  else if(s.type==="quick")b=`<h2>Quick log</h2><p class="sub small">For a session that just ended. Saved privately as an estimate; add details later from History if you like.</p>
    ${who(s.cat,s.cat==="poly"?s.n:2,"q")}<div class="col"><h3>About how long?</h3><div class="chips" role="group" aria-label="Duration">${[10,20,30,45,60,90].map(m=>`<button class="chip" data-act="qDur" data-v="${m}" aria-pressed="${s.min===m}">${m<60?m+" min":m/60+(m===60?" hour":" hours")}</button>`).join("")}</div></div>
    ${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="qSave" ${s.min?"":"disabled"}>Save</button>${close}`;
  else if(s.type==="sched")b=`<h2>When?</h2><label class="f" for="sch-in">Date and time<input type="datetime-local" id="sch-in" value="${esc(s.val)}"></label><p class="tiny">Clear it to unschedule. VOUZ doesn't book anything or check availability.</p>${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="schedSave">Save</button>${close}`;
  else if(s.type==="legacy"){const L=legacySessions(),nS=L.filter(x=>x.category==="solo").length,nP=L.length-nS;
    b=`<h2>Sessions are now Couple or Poly</h2><p class="sub">VOUZ now records two kinds of session: Couple, for two people, and Poly, for three or more. ${[nS?nS+" Solo session"+(nS===1?"":"s"):"",nP?nP+" Partnered session"+(nP===1?"":"s"):""].filter(Boolean).join(" and ")} can't be recorded either way, so ${L.length===1?"it is":"they are"} being removed from this device${S.user.mode==="account"?" and your synced copy":""}.</p><p class="sub small">Duo, Trio and Group sessions were kept and converted. This can't be undone, so download a copy first if you might want ${L.length===1?"it":"them"}.</p>
      <button class="btn block" data-act="legacyExport">${ic("download")} Download a copy first</button><button class="btn danger block" data-act="legacyRemove">Remove ${L.length} session${L.length===1?"":"s"}</button>`}
  else if(s.type==="people"){const ss=S.sessions.find(x=>x.id===s.id)||{},have=(ss.people||[]).map(p=>p.id),list=Soc.ready()?Soc.conns().filter(i=>!have.includes(i)):[];
    b=`<h2>Add someone</h2>${!Soc.ready()?`<p class="sub">${S.settings.social?"Social can't be reached right now, so invites can't be sent. Try again in a moment.":"Adding people works through Social, which is off. Turn it on in Profile, connect with someone, and they'll show up here."}</p>`:list.length?`<p class="sub">Pick from your connections. They get an invite and nothing is linked until they accept.</p><div>${list.map(i=>`<button class="ach" style="width:100%;text-align:left;min-height:52px" data-act="inviteAsk" data-id="${esc(i)}"><span class="av" aria-hidden="true">${esc(Soc.handle(i)[0].toUpperCase())}</span><span class="grow"><b>${esc(Soc.handle(i))}</b></span>${ic("plus")}</button>`).join("")}</div>`:`<p class="sub">${Soc.conns().length?"Everyone you're connected with is already on this session.":"You have no connections yet. Connect with someone under Social, People, and they'll show up here."}</p>`}${close}`}
  else if(s.type==="socialOn")b=`<h2>Turn on Social</h2><p class="sub">You'll get a Social tab. Nothing is shared until you build a card, preview it and confirm. You can turn this off again at any time.</p><label class="f" for="s-handle">Pick a handle <em>A nickname is fine. Your real name isn't used.</em><input type="text" id="s-handle" maxlength="24" autocomplete="off" value="${esc(s.handle||"")}"></label>${sw("sheetPrivate",s.priv,"Private profile","Stay out of the list of people open to connecting.")}${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block ${ui.busy?"busy":""}" data-act="socialOnYes">${ui.busy?"Setting up…":"Turn on Social"}</button>${close}`;
  else if(s.type==="handle")b=`<h2>Change handle</h2><label class="f" for="s-handle">Handle<input type="text" id="s-handle" maxlength="24" autocomplete="off" value="${esc((Soc.me()||{}).handle||"")}"></label>${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="handleSave">Save</button>${close}`;
  else if(s.type==="socialOff")b=`<h2>Turn off Social?</h2><p class="sub">Right away: your profile is deleted, nothing new can be shared, and your cards, comments, reactions and connections are taken out of shared storage. Tracking carries on exactly as before.</p>${sw("sheetWipe",s.wipe,"Delete them instead of keeping them","Off: they're kept in your private space and come back if you turn Social on again. On: they're gone for good.")}<button class="btn primary block ${ui.busy?"busy":""}" data-act="socialOffYes">Turn off Social</button>${close}`;
  else if(s.type==="wipeShared")b=`<h2>Delete everything you've shared?</h2><p class="sub">Removes all your cards, reactions and comments for everyone. Your private sessions aren't touched. This can't be undone.</p><button class="btn danger block" data-act="wipeSharedYes">Delete shared content</button>${close}`;
  else if(s.type==="deleteAccount")b=`<h2>Delete your account?</h2><p class="sub">This permanently erases every session, note and setting on this device${Cloud.state==="ready"?", your synced copy, your keys and everything you shared in Social":""}. There's no undo and no backup kept.</p><label class="f" for="del-in">Type DELETE to confirm<input type="text" id="del-in" autocomplete="off"></label>${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn danger block ${ui.busy?"busy":""}" data-act="deleteAccountYes">${ui.busy?"Erasing…":"Erase everything"}</button>${close}`;
  else if(s.type==="pinSet")b=`<h2>Set a passcode</h2><label class="f" for="pin-new">4 digits<input class="pin" type="password" id="pin-new" inputmode="numeric" maxlength="4" autocomplete="off"></label><p class="tiny">A screen lock, not encryption. If you forget it, the only way back in is erasing this device's VOUZ data.</p>${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="pinSave">Turn on lock</button>${close}`;
  else if(s.type==="forgot")b=`<h2>Forgot your passcode?</h2><p class="sub">VOUZ can't recover it. You can erase the data on this device and start again.${S.user.mode==="account"?" Your synced copy can be restored afterwards.":""}</p><button class="btn danger block" data-act="forgotErase">Erase this device's data</button>${close}`;
  else if(s.type==="import")b=`<h2>Import a backup</h2><p class="sub">Choose a VOUZ export file. Its sessions are added to what's here; duplicates are skipped.</p><input type="file" id="imp-file" accept="application/json,.json" aria-label="Backup file">${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}<button class="btn primary block" data-act="importYes">Import</button>${close}`;
  else if(s.type==="export")b=`<h2>Your export</h2><p class="sub">Downloads aren't available in this view, so here is the file's contents to copy.</p><textarea id="exp-out" readonly style="min-height:160px;font-size:12px">${esc(s.json)}</textarea><button class="btn primary block" data-act="copyExport">Copy</button>${close}`;
  else if(s.type==="postMenu"){const mine=s.a===Cloud.uid,x=Soc.items.find(i=>i.a===s.a&&i.it.id===s.id);b=`<h2>${mine?"Your card":esc(Soc.handle(s.a))}</h2>${mine?`${x&&x.sealed?`<button class="btn block" data-act="audOpen" data-id="${esc(s.id)}">${ic("people")} Change who sees it</button>`:""}<button class="btn danger block" data-act="delPost" data-id="${esc(s.id)}">${ic("trash")} Delete this card</button>`:`<button class="btn block" data-act="report" data-a="${esc(s.a)}" data-id="${esc(s.id)}" data-kind="post">${ic("flag")} Report</button><button class="btn danger block" data-act="block" data-id="${esc(s.a)}">Block ${esc(Soc.handle(s.a))}</button>`}${close}`}
  else if(s.type==="aud"){const conns=Soc.conns();b=`<h2>Who sees this card</h2><div class="chips">${[["all","All connections"],["pick","Choose people"]].map(([v,l])=>`<button class="chip" data-act="audMode" data-v="${v}" aria-pressed="${s.aud===v}">${l}</button>`).join("")}</div>${s.aud==="pick"?`<div class="chips">${conns.map(i=>`<button class="chip" data-act="audPick" data-id="${esc(i)}" aria-pressed="${s.picks.includes(i)}">${esc(Soc.handle(i))}</button>`).join("")||'<span class="sub small">No approved connections yet.</span>'}</div>`:""}<p class="tiny">People you remove lose their key to this card straight away.</p><button class="btn primary block" data-act="audSave">Save</button>${close}`}
  else if(s.type==="report")b=`<h2>Report</h2><p class="sub">Goes to the people who moderate this space. The person isn't told who reported them.</p><div class="chips">${["Harassment","Pressure or coercion","Explicit imagery or detail","Shares someone without consent","Something else"].map(r=>`<button class="chip" data-act="reportWhy" data-v="${r}" aria-pressed="${s.why===r}">${r}</button>`).join("")}</div><button class="btn primary block" data-act="reportSend" ${s.why?"":"disabled"}>Send report</button>${close}`;
  else if(s.type==="conn"){const l=Soc.perms[s.id]||{};b=`<h2>${esc(Soc.handle(s.id))}</h2><p class="sub small">Choose what this connection can open of yours. Turning one off removes their key to those cards.</p>${sw("permRecaps",l.recaps!==false,"Recap cards","Connections-only recap cards you post.",`data-id="${esc(s.id)}"`)}${sw("permAch",l.achievements!==false,"Achievement cards","Connections-only achievement cards you post.",`data-id="${esc(s.id)}"`)}<button class="btn danger block" data-act="disconnect" data-id="${esc(s.id)}">Disconnect</button><button class="btn danger block" data-act="block" data-id="${esc(s.id)}">Block</button><button class="btn ghost block" data-act="closeSheet">Done</button>`}
  else if(s.type==="guidelines")b=`<h2>Community guidelines</h2><ul class="plain">${["Be kind. Comments are for support, not scorekeeping.","No explicit images or graphic detail. Cards are text only.","Never share or hint at another person's involvement without their say-so.","No pressure, dares or comparisons. Nobody owes anyone a number.","No harassment. Block freely and report what crosses the line.","Adults only."].map(t=>`<li>${ic("check")}<span>${t}</span></li>`).join("")}</ul><button class="btn ghost block" data-act="closeSheet">Close</button>`;
  return`<div class="overlay${isNew?" in":""}" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" tabindex="-1">${b}</div></div>`}

/* ============ actions ============ */
async function hashPin(pin,salt,alg){try{if(alg==="pbkdf2"){const k=await crypto.subtle.importKey("raw",te.encode(pin),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:te.encode(salt),iterations:150000},k,256))}
    return hex(await crypto.subtle.digest("SHA-256",te.encode(salt+":"+pin)))}catch(e){let x=5381;for(const c of te.encode(salt+":"+pin))x=((x<<5)+x+c)>>>0;return "f"+x.toString(16)}}
function demoExps(){const b=startOfDay(Date.now()),mk=(back,kind,title,cat,o={})=>({id:"demox"+back+kind,demo:true,kind,title,date:back===null?null:addDays(b,-back)+19*36e5,cat,location:"",favorite:"",mood:"",notes:"",sharedNote:"",space:null,anniv:false,photos:[],idea:null,createdAt:b,updatedAt:b,...o});
  return[mk(4,"done","Dinner on the terrace","dinner",{location:"The place by the water",favorite:"Ordering dessert first",mood:"Playful"}),mk(18,"done","Coast weekend","trip",{location:"Up the coast",favorite:"The fog lifting on Sunday",mood:"Relaxed"}),
    mk(365-12,"done","First date","milestone",{anniv:true,favorite:"Talking until they closed",mood:"Curious"}),mk(31,"done","Pottery class","adventure",{mood:"Connected"}),mk(null,"plan","Stargaze away from city lights","other",{idea:"stars"}),mk(-6,"plan","Cook something new together","other",{idea:"cook"})]}
function demoSessions(){const out=[],base=startOfDay(Date.now()),plan=[[1,21,40,34,2,"Tender",5],[3,7,15,18,2,"Relaxed",4],[6,22,30,41,3,"Electric",4],[9,20,5,27,2,"Playful",5],[12,23,10,22,2,"",0],[15,8,20,31,2,"Connected",4],[19,21,0,48,4,"Tender",5],[23,22,45,16,2,"Curious",3],[27,19,30,36,2,"Playful",4],[33,10,0,29,2,"Relaxed",0],[38,23,20,24,3,"",4],[45,21,15,39,2,"Electric",5]];
  plan.forEach(([back,h,m,dur,n,mood,sat],i)=>{const st=addDays(base,-back)+h*36e5+m*6e4,d=dur*60+((i*17)%50);out.push({id:"demo"+i,demo:true,title:"",start:st,durationSec:d,segments:i%3?null:[[st,st+d*400],[st+d*400+18e4,st+d*1e3+18e4]],category:n>2?"poly":"couple",participants:n,satisfaction:sat||null,sharedNote:"",tags:i%4===0?["weekend"]:[],mood,notes:"",reflection:i===0?"Demo reflection: an unhurried evening.":"",hrAvg:i%2?"":String(96+i*2),hrPeak:i%2?"":String(128+i*3),people:[],createdAt:st,updatedAt:st})});return out}
function compose(o){ui.compose=Object.assign({kind:"recap",sid:null,title:"",caption:"",showDuration:true,showCategory:false,badge:"",style:0,aud:"all",picks:[],step:"edit"},o);if(ui.compose.kind!=="recap"&&S.settings.defaultVis==="everyone")ui.compose.aud="everyone";openPage({type:"compose"})}
const setProfile=h=>Soc.write("profiles",{handle:h||Soc.me().handle,discoverable:!S.settings.privateProfile,pub:S.keys.pub,at:Date.now()});
const myPosts=()=>Soc.posts[Cloud.uid]||{};
const busy=async f=>{if(ui.busy)return;ui.busy=true;render();try{await f()}finally{ui.busy=false;render()}};
const A={
  tab(e){go(e.dataset.tab)},
  back(){const p=ui.page;if(p&&p.type==="details"&&S.draft&&!S.draft.fromTimer){S.draft=null;save()}
    if(p&&p.type==="expEdit"&&ui.xd){ui.xd.added.forEach(id=>Photos.del(id));ui.xd=null}
    if(p&&p.type==="compose")ui.compose=null;
    ui.page=p&&p.from?p.from:null;ui.err="";render(true)},
  page(e){openPage({type:e.dataset.page})},
  sheet(e){ui.err="";sheet({type:e.dataset.s,id:e.dataset.id})},
  closeSheet(){ui.err="";sheet(null)},
  overlay(e,ev){if(ev.target===e&&!(ui.sheet&&ui.sheet.type==="legacy"))A.closeSheet()},
  legacyExport(){return A.exportData()},
  legacyRemove(){const L=legacySessions(),ids=new Set(L.map(x=>x.id)),now=Date.now();Soc.drop(L.flatMap(x=>x.people||[]));
    S.sessions=S.sessions.filter(x=>!ids.has(x.id));ids.forEach(id=>S.deleted[id]=now);ui.sheet=null;save();render(true);toast(L.length+" session"+(L.length===1?"":"s")+" removed.")},
  confirmYes(){const f=ui.sheet.fn;ui.sheet=null;f()},
  /* onboarding */
  obNext(){const o=ui.ob;if(o.step===1&&!o.adult)return;
    if(o.step<2){o.step++;render(true);return}
    S.onboarded=true;S.user.name=o.name.trim();S.user.mode=o.mode==="account"&&Cloud.state==="ready"?"account":"local";S.user.createdAt=Date.now();save();ui.tab="home";render(true);
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
    if(o.social&&Cloud.state==="ready"&&K.ok){ui.err="";sheet({type:"socialOn",priv:true})}},
  obBack(){ui.ob.step=Math.max(0,ui.ob.step-1);render(true)},
  obAdult(){ui.ob.adult=!ui.ob.adult;render()},
  async obMode(e){ui.ob.mode=e.dataset.mode;ui.ob.restore=null;render();if(e.dataset.mode==="account"){const v=await Cloud.readVault();if(v&&ui.ob.mode==="account"&&!S.onboarded){ui.ob.restore=v;render()}}},
  obRestore(){const v=ui.ob.restore;S=Object.assign(fresh(),{onboarded:true,stamp:v.stamp||0,user:Object.assign({},v.user,{mode:"account"}),settings:Object.assign(fresh().settings,v.settings),sessions:v.sessions||[],deleted:v.deleted||{},blocks:v.blocks||[],ignored:v.ignored||[]});saveLocal();ui.tab="home";if(S.settings.social)Soc.start();render(true);toast("Restored from your account.")},
  obSocial(){ui.ob.social=!ui.ob.social;render()},
  /* home + replay interactions */
  pickDay(e){ui.homeDay=+e.dataset.i;buzz(8);render();const g=document.querySelector(`.stage g[data-i="${e.dataset.i}"]`);g&&g.focus({preventScroll:true})},
  rSeg(e){const i=+e.dataset.i;ui.rp.seg=ui.rp.seg===i?null:i;render()},
  rScope(e){ui.rp.scope=e.dataset.v;render()},
  rMood(e){const s=S.sessions.find(x=>x.id===ui.page.id);if(!s)return;const t=$("#rf-text");if(t)s.reflection=t.value.trim().slice(0,600);s.mood=s.mood===e.dataset.v?"":e.dataset.v;s.updatedAt=Date.now();save();render()},
  rSave(){const s=S.sessions.find(x=>x.id===ui.page.id);if(!s)return;s.reflection=($("#rf-text").value||"").trim().slice(0,600);s.updatedAt=Date.now();save();render();toast(s.reflection?"Reflection saved, privately.":"Reflection cleared.")},
  /* timer */
  start(){if(S.active)return go("track");S.active={segments:[[Date.now(),null]],category:ui.trackCat,participants:ui.trackCat==="poly"?ui.trackP:2};S.draft=null;save();buzz(20);go("track")},
  pause(){const s=S.active.segments;s[s.length-1][1]=Date.now();save();buzz(10);render()},
  resume(){S.active.segments.push([Date.now(),null]);save();buzz(10);render()},
  finish(){S.draft=draftFromActive();S.active=null;save();buzz([15,40,15]);openPage({type:"details"})},
  resumeDraft(){openPage({type:"details"})},
  askCancel(){sheet({type:"confirm",title:"Discard this session?",body:"The time you tracked won't be saved.",yes:"Discard",danger:true,fn(){S.active=null;S.draft=null;save();ui.page=null;go("track");toast("Session discarded.")}})},
  manual(){S.draft=blankDraft();openPage({type:"details",from:ui.page})},
  /* session form */
  addPeople(e){ui.err="";sheet({type:"people",id:e.dataset.id})},
  inviteAsk(e){const sid=ui.sheet.id,id=e.dataset.id,s=S.sessions.find(x=>x.id===sid);if(!s)return A.closeSheet();const h=Soc.handle(id);
    sheet({type:"confirm",title:"Add "+h+" to this session?",body:h+" will get an invite showing the date, time, length"+(s.category?", "+catLabel(s):"")+(s.sharedNote?" and your shared note":"")+". Not your private notes, satisfaction, mood, tags, heart rate or title. Nothing is added to their log unless they accept.",yes:"Send invite",fn(){busy(async()=>{
      const room=s.category==="poly"?(s.participants||3)-1:s.category==="couple"?1:PMAX;if((s.people||[]).filter(p=>!p.from).length>=room)return toast(s.category==="couple"?"A Couple session has one other person.":"Everyone counted on this session has been invited.");
      try{const i=await Soc.invite(s,id);s.people=(s.people||[]).concat([{id,h,i}]);s.updatedAt=Date.now();save();toast("Invite sent to "+h+".")}catch(x){toast("That invite couldn't be sent. Nothing was shared.")}})}})},
  personOff(e){const s=S.sessions.find(x=>x.id===e.dataset.sid);if(!s)return;const p=(s.people||[]).find(x=>x.i===e.dataset.i);if(!p)return;
    s.people=s.people.filter(x=>x!==p);s.updatedAt=Date.now();save();Soc.drop([p]);render();toast(p.from?"Removed. "+p.h+" will see you're no longer on it.":"Removed, and the invite is withdrawn.")},
  invYes(e){const v=Soc.inbox.find(x=>x.a===e.dataset.a&&x.i===e.dataset.i);if(!v)return;const h=Soc.handle(v.a);busy(async()=>{
    try{await Soc.respond(v.a,v.i,true)}catch(x){return toast("That couldn't be saved. Try again.")}

/* REWARDS-START — VOUZ Points, badges, levels and weekly challenges.
   Every point comes from a record that exists right now, under a key that can only ever be awarded once
   ("exp:<id>", "cat:dinner", "ses:<week>"…). Nothing is stored as a running total, so a point can't be
   awarded twice, deleting a record takes its points back, and creating and deleting to farm points nets nothing.
   Daily and weekly caps stop rapid logging from earning more. Intimacy earns at most once a week, the same for one
   session or ten, so how often, how long or how many people never earns more. */
const RW=(()=>{
  /* Configurable values. Starting points, not an economy. */
  const VP={memory:20,newKind:50,planDone:75,bucket:100,session:10,confirmed:10,challenge:150};
  const CAPS={memoriesPerDay:3,plansPerDay:2,sessionWeeks:1,challengesPerWeek:1};
  const LEVELS=[[0,"Spark"],[100,"Kindling"],[250,"Ember"],[450,"Glow"],[700,"Flame"],[1000,"Hearth"],[1400,"Lantern"],[1900,"Beacon"],[2500,"Comet"],[3200,"Constellation"],[4000,"Aurora"],[5000,"Starlight"]];
  const KINDS={dinner:"Dinner date",trip:"Trip",adventure:"Adventure",movie:"Movie",celebration:"Celebration",romantic:"Romantic",milestone:"Milestone",other:"Other"};
  const pad=n=>String(n).padStart(2,"0");
  const dayK=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  /* Monday-to-Sunday weeks in local time, as a whole number. */
  const week=t=>{const d=new Date(t),n=Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);return(n-(d.getDay()+6)%7-4)/7};
  const weekStart=w=>{const u=new Date((w*7+4)*864e5);return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate()).getTime()};
  const made=e=>e.createdAt||e.date||0;
  const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");

  /* Weekly challenges: none involve intimacy, and none keep a streak. */
  const CHALLENGES=[
    {id:"newrest",t:"Try a new restaurant",d:"Log a dinner date somewhere new to you both.",kinds:["dinner"],newPlace:true,b:2,e:1,g:["food"]},
    {id:"newplace",t:"Go somewhere neither of you has been",d:"Log a memory with a place you haven't logged before.",newPlace:true,b:1,e:2,g:["adventure","culture"]},
    {id:"screenfree",t:"Plan a screen-free date",d:"Phones away from start to finish.",attest:"No phones or screens for the whole date",b:0,e:1,g:["romance","home"]},
    {id:"cook",t:"Cook a new recipe together",d:"Something neither of you has made.",attest:"You cooked it together",kinds:["dinner","romantic","other"],b:1,e:1,g:["food","home"]},
    {id:"outdoor",t:"Complete an outdoor adventure",d:"A hike, a ride, a swim: anything outside.",kinds:["adventure","trip"],b:0,e:3,g:["outdoors","adventure"]},
    {id:"surprise",t:"Surprise your partner with something thoughtful",d:"Small counts.",attest:"It was a surprise",b:1,e:1,g:["romance"]},
    {id:"culture",t:"See a show, gallery or museum",d:"Something live or something on a wall.",kinds:["celebration","movie","adventure","other"],b:2,e:1,g:["culture","music"]},
    {id:"theme",t:"Hold a themed movie night",d:"Pick a theme and a snack to match.",kinds:["movie"],b:0,e:1,g:["home"]},
    {id:"green",t:"Take a long walk somewhere green",d:"No destination needed.",kinds:["adventure","romantic","other"],b:0,e:2,g:["outdoors","wellness"]},
    {id:"letters",t:"Write each other a letter",d:"Swap them over dinner.",attest:"You both wrote one",b:0,e:1,g:["romance","home"]},
    {id:"learn",t:"Learn something new together",d:"A class, a video, a skill.",kinds:["adventure","other"],b:2,e:2,g:["learning"]},
    {id:"brunch",t:"Have a slow brunch",d:"No alarm beforehand.",kinds:["dinner"],b:1,e:1,g:["food"]}
  ];

        for(const it of (d.req||[]))if(it&&it.t===x.tag){try{const b=await this.open(x.key,it.c);if(b&&typeof b.id==="string"&&typeof b.expId==="string")creq.push({id:b.id,expId:b.expId,author:str(b.author,64),title:str(b.title,80)||"a memory",by:u,sp:x.id,at:+b.at||0})}catch(e){}}

  /* Mutual Match round for every space I'm in: refresh my own blinded set, forward everyone else's, work out matches. */
  async runMatch(){const me=Cloud.uid,res={},docsOut={};
    for(const x of this.inSpaces()){const members=this.people(x).filter(u=>!S.blocks.includes(u));if(!members.includes(me))members.push(me);members.sort();
      const ep=await PSI.epoch(x.tag,members),docs={};
      for(const u of members){if(u===me)continue;for(const it of ((this.match[u]||{}).items||[]))if(it&&it.t===x.tag){try{const b=await this.open(x.key,it.c);if(b&&b.ep===ep)docs[u]={own:b.own,fwd:b.fwd||{}}}catch(e){}}}
      let st=S.psi[x.id];const picks=Array.isArray(S.picks[x.id])?S.picks[x.id].filter(p=>IDEA[p]).slice(0,PSI.CAP):null;
      if(!st||st.ep!==ep){st={ep,k:PSI.newKey(),sig:null,order:null,own:null,fwd:{}}}
      const sig=picks?picks.slice().sort().join(","):null;
      if(picks&&st.sig!==sig){const o=await PSI.own(x.tag,picks,st.k);st.order=o.order;st.own=o.vals;st.sig=sig}
      if(!picks){st.order=null;st.own=null;st.sig=null}
      st.fwd=await PSI.forward(members,me,{...docs,[me]:{own:st.own,fwd:st.fwd}},st.k,st.fwd);
      if(JSON.stringify(S.psi[x.id])!==JSON.stringify(st)){S.psi[x.id]=st;saveLocal()}
      const all={...docs,[me]:{own:st.own,fwd:st.fwd}},fin=await PSI.finals(members,all);
      res[x.id]={members,waiting:members.filter(u=>!(all[u]&&PSI.okSet(all[u].own))),matches:PSI.matches(members,me,fin,st.order)};
      docsOut[x.id]=st.own||Object.keys(st.fwd).length?{t:x.tag,ep,own:st.own,fwd:st.fwd}:null}

  async answerFrom(u,id){const r=this.rel[u];if(!r)return null;let out=null;

  /* Owner only: move people who accepted into the member list, and drop anyone who declined, left, disconnected or was blocked.
     Anyone dropped held the key, so the space gets a new one. */
  async reconcileSpaces(){const me=Cloud.uid,cur=this.spaces[me];if(!cur||!cur.items||this.recSp)return;let changed=false;const items=[];
    for(const it of cur.items){const x=Object.values(this.sp).find(s=>s.item===it&&s.role==="owner");if(!x){items.push(it);continue}
      let members=x.members.slice(),invited=x.invited.slice();const drop=[];
      for(const u of members.concat(invited)){const r=this.rel[u];if(!r||!r.mutual||S.blocks.includes(u)){drop.push(u);continue}
        const a=await this.answerFrom(u,x.id);if(a===false)drop.push(u);else if(a===true&&invited.includes(u)){invited=invited.filter(v=>v!==u);members.push(u)}}
      members=members.filter(u=>!drop.includes(u));invited=invited.filter(u=>!drop.includes(u));
      if(drop.length||members.length!==x.members.length){changed=true;items.push(await this.sealSpace({id:x.id,name:x.name,owner:me,members,invited,v:x.v+(drop.length?1:0)},drop.length?null:x.raw))}else items.push(it)}

  /* My shared experiences and Mutual Match picks are rebuilt from this device's records under each space's current key. */
  async publishMine(){const me=Cloud.uid,inSp=Object.values(this.sp).filter(x=>x.role!=="invited");
    const md=this.mdocs||{},sig=JSON.stringify([inSp.map(x=>x.tag),S.exps.filter(e=>!e.demo&&e.space).map(e=>[e.id,e.space,e.updatedAt]),inSp.map(x=>md[x.id]||null),S.consent,this.creq.map(r=>r.id)]);

      if(md[x.id])pk.push({t:x.tag,c:await K.encJ(x.key,{ep:md[x.id].ep,own:md[x.id].own,fwd:md[x.id].fwd})})}
    const cq=[],ca=[],tagOf=Object.fromEntries(inSp.map(x=>[x.id,x]));
    for(const r of (S.consent.req||[])){const x=tagOf[r.sp];if(x)cq.push({t:x.tag,c:await K.encJ(x.key,{id:r.id,expId:r.expId,author:r.author,title:r.title,at:r.at})})}
    for(const [rid,ok] of Object.entries(S.consent.ans||{})){const r=this.creq.find(z=>z.id===rid),x=r&&tagOf[r.sp];if(x)ca.push({t:x.tag,c:await K.encJ(x.key,{req:rid,ok})})}
    if(cq.length||ca.length||((this.consent[me]||{}).req||[]).length||((this.consent[me]||{}).ans||[]).length)await this.write("consent",{req:cq,ans:ca});
    if(ex.length||((this.exps[me]||{}).items||[]).length)await this.write("exps",{items:ex});
    if(pk.length||((this.match[me]||{}).items||[]).length)await this.write("match",{items:pk})},
  async answerSpace(x,ok){const r=this.rel[x.owner];if(!r)throw 0;const cur=this.spaces[Cloud.uid]||{};
    const keep=(cur.acc||[]).filter(a=>{const raw=this.accRaw.find(z=>z.c===a.c);return!(raw&&raw.id===x.id)});
    keep.push({k:r.out,c:await K.encJ(r.key,{id:x.id,ok})});
    await this.write("spaces",{items:cur.items||[],acc:keep})},
  async saveSpaces(items){const cur=this.spaces[Cloud.uid]||{};await this.write("spaces",{items,acc:cur.acc||[]})},
  inSpaces(){return Object.values(this.sp).filter(x=>x.role!=="invited")},
  spaceName(id){const x=this.sp[id];return x?x.name:null},
  people(x){return [x.owner,...x.members].filter((u,i,a)=>a.indexOf(u)===i)}
});

  return{ppl,waiting:r?r.waiting:ppl,pending:!!(r&&!r.waiting.length&&!r.matches),matches:r&&r.matches?r.matches.map(id=>IDEA[id]).filter(Boolean):[]}}

      else{const x=Soc.sp[ui.disc.space]&&Soc.sp[ui.disc.space].role!=="invited"?Soc.sp[ui.disc.space]:sps[0];ui.disc.space=x.id;const m=matchFor(x),mine=new Set(S.picks[x.id]||[]),list=IDEAS.filter(i=>ideaOk(i,f));

function blankX(kind){return{editing:null,kind,title:"",date:kind==="plan"?"":dayKey(Date.now()),cat:kind==="plan"?"other":"dinner",location:"",favorite:"",mood:"",notes:"",sharedNote:"",space:null,anniv:false,photos:[],added:[],removed:[],idea:null}}

    S.exps.push({id:uid(),kind:"plan",title:x.t,date:null,cat:"other",location:"",favorite:"",mood:"",notes:"",sharedNote:"",space:null,anniv:false,photos:[],idea:x.id,createdAt:now,updatedAt:now});save();render();toast("Saved to your plans.")},

    S.exps.push({id:uid(),kind:"plan",title:x.t,date:null,cat:"other",location:"",favorite:"",mood:"",notes:"",sharedNote:"",space:sp,anniv:false,photos:[],idea:x.id,createdAt:now,updatedAt:now});save();Soc.sched();render();toast("Planned. Everyone in "+Soc.sp[sp].name+" can see it.")},

function plannerPrompt(p){const titles=p.history?S.exps.filter(e=>!e.demo).map(e=>(e.kind==="plan"?"planned: ":"done: ")+String(e.title).slice(0,60)).slice(0,40):[];
  return["You are the date planner inside VOUZ, a private app where couples and partners plan time together.",
    "Suggest 3 to 5 experiences for them that fit the request.",
    "Rules: do not name specific businesses or claim anything about a real place's opening hours, prices, reservations, events or availability; describe kinds of places instead (\"a small wine bar\", \"a trail with a view\"), so they can look up real places themselves. Never say you have booked, bought, reserved or contacted anything: you can't. Keep it warm, tasteful and non-explicit. Respect the budget and time if given. If an area is given, fit suggestions to that kind of area without inventing venues.",
    'Reply with only JSON: {"suggestions":[{"title":"under 60 characters","why":"one sentence, under 160 characters","cost":"Free" or "$" or "$$" or "$$$","time":"short, e.g. 2 hours","setting":"Indoors" or "Outdoors" or "Either","steps":["up to 4 short steps"]}]}',
    "",

    "Budget: "+(PB.find(x=>x[0]===p.budget)||PB[0])[1],

function cleanPlans(v){const arr=v&&Array.isArray(v.suggestions)?v.suggestions:Array.isArray(v)?v:[];const str=(x,n)=>typeof x==="string"?x.trim().slice(0,n):"";
