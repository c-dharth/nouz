   <p class="tiny" id="mc-meta" style="text-align:center">${mc.meta||W+" × "+H+" · "+ratio}</p>
   ${cs.x?`<div class="card ${cs.ok?"":"line"}"><div class="row between"><h3>Everyone in ${esc(cs.x.name)} agrees?</h3><span class="pill ${cs.ok?"ok":cs.no?"":"w"}">${cs.ok?"Yes":cs.no?"Not agreed":cs.req?"Waiting":"Not asked"}</span></div>
     <p class="sub small">This memory is shared in ${esc(cs.x.name)}, so it's theirs too. Before it goes anywhere else, everyone in the space has to agree.</p>
     ${cs.per.length?`<div>${cs.per.map(p=>`<div class="hist"><span class="grow">${esc(Soc.handle(p.u))}</span><span class="sub small">${{yes:"Agreed",no:"Didn't agree",wait:"Asked",none:"Not asked yet"}[p.v]}</span></div>`).join("")}</div>`:""}
     ${cs.ok?"":`<button class="btn sm ${cs.req?"ghost":"primary"}" style="align-self:flex-start" data-act="mcAsk">${cs.req?"Ask again":"Ask to share"}</button>`}
     <p class="tiny">They'd be asked about this memory's card: title, date, place and the caption you write. Never private notes.</p></div>`:cs.gone?`<div class="card line"><p class="sub small">The space this was shared in has ended, so it can't be shared outside it.</p></div>`:""}
   <div class="col"><h3>Template</h3><div class="chips sm">${chips("mcTpl",CARD_TPL,mc.tpl)}</div></div>
   <div class="col"><h3>Shape</h3><div class="chips sm">${Object.entries(CARD_FMT).map(([k,v])=>`<button class="chip" data-act="mcFmt" data-v="${k}" aria-pressed="${mc.fmt===k}">${{portrait:"Story 9:16",square:"Square 1:1",landscape:"Wide 16:9"}[k]}</button>`).join("")}</div></div>
   <div class="col"><h3>Background</h3><div class="chips sm">${chips("mcBg",CARD_BG,mc.bg)}</div></div>
   <label class="f" for="mc-cap">Caption <em>Optional, up to 160 characters</em><textarea id="mc-cap" data-bind="mc.caption" maxlength="160" placeholder="${esc(e.favorite?"e.g. "+e.favorite:"A line about it")}">${esc(mc.caption)}</textarea></label>
   ${e.favorite&&mc.caption!==e.favorite?`<button class="link small" data-act="mcFav">Use your favorite moment</button>`:""}
   ${mine&&(e.photos||[]).length?`<div class="col"><h3>Photos <span class="tiny" style="text-transform:none;letter-spacing:0">Up to 3</span></h3><div class="phs">${e.photos.map(id=>{const on=mc.photos.includes(id);return`<button class="ph pickph" data-act="mcPhoto" data-v="${esc(id)}" aria-pressed="${on}" aria-label="${on?"Remove":"Add"} this photo"><img data-photo="${esc(id)}" alt=""><span class="tick" aria-hidden="true">${on?mc.photos.indexOf(id)+1:"+"}</span></button>`}).join("")}</div></div>`:mine?"":`<p class="tiny">Photos stay on the device of the person who added them, so this card has none.</p>`}
   <div class="card">${sw("mcDate",mc.showDate,"Show the date")}${e.location?sw("mcLoc",mc.showLoc,"Show the place",esc(e.location)):""}${sw("mcBrand",mc.showBrand,"Show VOUZ branding","A small wordmark in the corner.")}</div>
   <p class="tiny">Never on a card: intimacy records, session details, private notes, mood or anything about who you're with. The saved image carries no location data from your photos, and making it doesn't change or share the memory itself.${mine&&!cs.x?" If someone else is in a photo, check with them first.":""}</p>
   ${ui.err?`<p class="err" role="alert">${esc(ui.err)}</p>`:""}
   <button class="btn primary block" data-act="mcShare" ${blocked?"disabled":""}>${ic("share")} Share</button>
   <div class="row"><button class="btn grow" data-act="mcSave" data-v="png" ${blocked?"disabled":""}>Save PNG</button><button class="btn grow" data-act="mcSave" data-v="jpg" ${blocked?"disabled":""}>Save JPEG</button></div>
   ${navigator.clipboard&&window.ClipboardItem?`<button class="btn ghost block" data-act="mcCopy" ${blocked?"disabled":""}>Copy image</button>`:""}
   <p class="tiny">Share opens your phone's share sheet where it's available: pick Instagram (then Story), WhatsApp, Messages or Save Image. Elsewhere the image is saved so you can share it from Photos or your files.</p></div>`}

/* Redraw only when something that changes the picture has changed. */
async function refreshCard(){const mc=ui.mc,e=cardTarget();if(!mc||!e||!$("#mc-img"))return;const key=JSON.stringify([mc.tpl,mc.fmt,mc.bg,mc.caption,mc.showDate,mc.showLoc,mc.showBrand,mc.photos,e.title,e.date,e.location]);
  if(key===mc.key&&mc.url){const im=$("#mc-img");if(im&&!im.src)im.src=mc.url;return}if(mc.drawing===key)return;mc.drawing=key;
  try{const cv=await renderCard(mc,e),b=await canvasBlob(cv,"image/png");if(ui.mc!==mc||mc.drawing!==key)return;if(mc.url)URL.revokeObjectURL(mc.url);
    mc.url=URL.createObjectURL(b);mc.key=key;mc.drawing=null;mc.meta=cv.width+" × "+cv.height+" · "+CARD_FMT[mc.fmt][2]+" · "+(b.size/1048576).toFixed(1)+" MB as PNG";
    const im=$("#mc-img");if(im)im.src=mc.url;const bz=$("#mc-busy");if(bz)bz.hidden=true;const mt=$("#mc-meta");if(mt)mt.textContent=mc.meta}
  catch(x){mc.drawing=null;const bz=$("#mc-busy");if(bz){bz.hidden=false;bz.textContent="The card couldn't be drawn here."}}}
let DL=null;
async function cardFile(type){const mc=ui.mc,e=cardTarget();const cv=await renderCard(mc,e),b=await canvasBlob(cv,type);return{blob:b,name:cardName(e,mc,type==="image/png"?"png":"jpg")}}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
/* Saving goes through the platform, which asks first; in the Claude iPhone app it opens the share sheet. */
async function saveOut(blob,name){if(!DL){try{DL=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(x){DL=null}}
  if(DL){try{await DL.save({filename:name,data:blob});return"saved"}catch(x){if(x&&x.code==="declined")return"declined";if(x&&x.code==="rate_limited")return"busy"}}
  return"unavailable"}
function guard(){const e=cardTarget();if(!e)return false;const cs=consentState(e,ui.mc.a);if(!cs.ok){toast(cs.gone?"This can't be shared outside its space.":"Everyone in the space needs to agree first.");return false}return true}
Object.assign(A,{
  mcOpen(e){const a=e.dataset.a||"me",x=findX(e.dataset.id,a);if(!x)return;ui.err="";if(ui.mc&&ui.mc.url)URL.revokeObjectURL(ui.mc.url);
    ui.mc={id:x.id,a,tpl:"minimal",fmt:"portrait",bg:"wine",caption:"",showDate:true,showLoc:!!x.location,showBrand:true,photos:a==="me"?(x.photos||[]).slice(0,1):[],url:null,key:null};openPage({type:"cardEdit",from:ui.page})},
  mcTpl(e){ui.mc.tpl=e.dataset.v;render()},mcFmt(e){ui.mc.fmt=e.dataset.v;ui.mc.url=null;render()},mcBg(e){ui.mc.bg=e.dataset.v;render()},
  mcDate(){ui.mc.showDate=!ui.mc.showDate;render()},mcLoc(){ui.mc.showLoc=!ui.mc.showLoc;render()},mcBrand(){ui.mc.showBrand=!ui.mc.showBrand;render()},
  mcFav(){const e=cardTarget();ui.mc.caption=String(e.favorite||"").slice(0,160);render()},
  mcPhoto(e){const p=ui.mc.photos,v=e.dataset.v;ui.mc.photos=p.includes(v)?p.filter(x=>x!==v):p.length>=3?p:p.concat([v]);if(p.length>=3&&!p.includes(v))toast("Up to 3 photos.");render()},
  async mcAsk(){const e=cardTarget(),cs=consentState(e,ui.mc.a);if(!cs.x)return;const author=ui.mc.a==="me"?Cloud.uid:ui.mc.a;
    S.consent.req=(S.consent.req||[]).filter(r=>!(r.expId===e.id&&r.author===author&&r.sp===cs.x.id)).concat([{id:uid(),expId:e.id,author,sp:cs.x.id,title:String(e.title||"").slice(0,80),at:Date.now()}]);
    save();Soc.sched();render();toast("Asked. Sharing unlocks once everyone agrees.")},
  async mcShare(){if(!guard())return;let f;try{f=await cardFile("image/png")}catch(x){return toast("The card couldn't be drawn here.")}
    const cap=window.Capacitor;
    if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&cap.Plugins&&cap.Plugins.Share&&cap.Plugins.Filesystem){   /* native app: PENDING DEVICE TEST */
      try{const w=await cap.Plugins.Filesystem.writeFile({path:f.name,data:await blobB64(f.blob),directory:"CACHE"});await cap.Plugins.Share.share({title:"A VOUZ memory",files:[w.uri]});return}catch(x){if(/cancel/i.test(String(x&&x.message)))return}}
    const file=typeof File==="function"?new File([f.blob],f.name,{type:"image/png"}):null;
    if(file&&navigator.canShare&&navigator.share){let can=false;try{can=navigator.canShare({files:[file]})}catch(x){}
      if(can){try{await navigator.share({files:[file],title:"A VOUZ memory"});return}catch(x){if(x&&x.name==="AbortError")return}}}
    const r=await saveOut(f.blob,f.name);
    toast(r==="saved"?"Ready: pick Instagram, WhatsApp, Messages or Save Image.":r==="declined"?"Not saved.":r==="busy"?"A save is already open. Try again in a moment.":"Sharing isn't available in this view. Open VOUZ in the Claude app or a browser that supports sharing.")},
  async mcSave(e){if(!guard())return;const jpg=e.dataset.v==="jpg";let f;try{f=await cardFile(jpg?"image/jpeg":"image/png")}catch(x){return toast("The card couldn't be drawn here.")}
    const r=await saveOut(f.blob,f.name);toast(r==="saved"?"Saved "+f.name+".":r==="declined"?"Not saved.":r==="busy"?"A save is already open. Try again in a moment.":"Saving isn't available in this view.")},
  async mcCopy(){if(!guard())return;try{const f=await cardFile("image/png");await navigator.clipboard.write([new ClipboardItem({"image/png":f.blob})]);toast("Image copied.")}
    catch(x){toast("Copying images isn't allowed here. Save or share it instead.")}},
  consentAns(e){const id=e.dataset.v,ok=e.dataset.ok==="1";S.consent.ans={...(S.consent.ans||{}),[id]:ok};save();Soc.sched();render();toast(ok?"You agreed. You can change your mind under Shared spaces.":"Not agreed.")}
});
function consentCard(){if(!S.settings.social)return"";const open=Soc.creq.filter(r=>!(r.id in (S.consent.ans||{})));if(!open.length)return"";
  return`<div class="card line" role="region" aria-label="Requests to share"><h3>Requests to share a memory</h3><div>${open.map(r=>`<div class="col" style="gap:8px;padding:8px 0"><span><b>${esc(Soc.handle(r.by))}</b> would like to share a card of <b>“${esc(r.title)}”</b> outside ${esc(Soc.spaceName(r.sp)||"your space")}.</span><div class="row"><button class="btn sm primary grow" data-act="consentAns" data-v="${esc(r.id)}" data-ok="1">Agree</button><button class="btn sm ghost grow" data-act="consentAns" data-v="${esc(r.id)}" data-ok="0">Don't agree</button></div></div>`).join("")}</div><p class="tiny">A card shows the title, date, place and a caption they write. Never private notes or intimacy records.</p></div>`}
function consentGiven(){if(!S.settings.social)return"";const given=Soc.creq.filter(r=>S.consent.ans&&S.consent.ans[r.id]===true);if(!given.length)return"";
  return`<div class="card"><h3>Sharing you've agreed to</h3><div>${given.map(r=>`<div class="hist"><span class="grow">“${esc(r.title)}” <span class="sub small">by ${esc(Soc.handle(r.by))}</span></span><button class="btn sm ghost" data-act="consentAns" data-v="${esc(r.id)}" data-ok="0">Withdraw</button></div>`).join("")}</div><p class="tiny">Withdrawing stops new cards. A card already shared can't be called back.</p></div>`}

function bind(e){const b=e.dataset.bind;if(!b)return;const [o,k]=b.split(".");const tgt={ob:ui.ob,draft:S.draft,ins:ui.ins,compose:ui.compose,user:S.user,xd:ui.xd,plan:ui.plan,mc:ui.mc}[o];if(!tgt)return;tgt[k]=e.value;
  if(o==="draft"||e.dataset.save){S.stamp=Date.now();saveLocal();Cloud.queueVault()}}
document.addEventListener("input",ev=>{bind(ev.target);if(ev.target.id==="mc-cap"){clearTimeout(refreshCard.t);refreshCard.t=setTimeout(refreshCard,250)}if(ev.target.id==="c-title"){const b=$(".share .big");if(b)b.textContent=ev.target.value||"Less scrolling. More together."}});
document.addEventListener("change",ev=>{if(ev.target.dataset&&ev.target.dataset.live&&ev.target.type==="date"){bind(ev.target);render()}});
document.addEventListener("keydown",ev=>{const t=ev.target;
  if(ev.key==="Escape"&&ui.sheet){ev.preventDefault();return A.closeSheet()}
  if((ev.key==="Enter"||ev.key===" ")&&t.tagName==="g"&&t.dataset.act){ev.preventDefault();return A[t.dataset.act](t,ev)}
  if(ev.key==="Tab"&&ui.sheet){const f=Array.from(document.querySelectorAll(".sheet button:not([disabled]),.sheet input,.sheet textarea"));if(f.length){const a=document.activeElement,i=f.indexOf(a);if(ev.shiftKey&&i<=0){ev.preventDefault();f[f.length-1].focus()}else if(!ev.shiftKey&&(i===f.length-1||i<0)){ev.preventDefault();f[0].focus()}}return}
  if(ev.key!=="Enter"||t.tagName!=="INPUT")return;
  if(t.id==="d-tag"){ev.preventDefault();const v=t.value.trim();if(v&&S.draft.tags.length<8&&!S.draft.tags.includes(v)){S.draft.tags.push(v.slice(0,24));save();render();const n=$("#d-tag");n&&n.focus()}}
  else if(t.id==="pin-in")A.unlock(); else if(t.id==="addcode")A.addCode(); else if(t.id&&t.id.startsWith("c-")&&t.id!=="c-title")A.comment({dataset:{k:t.id.slice(2)}})});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.onboarded&&S.settings.pinHash&&!ui.locked){ui.locked=true;ui.sheet=null;ui.err="";render()}});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(S.onboarded&&!ui.locked&&TABS().some(x=>x[0]===t)&&(t!==ui.tab||ui.page)&&!legacySessions().length){ui.tab=t;ui.page=null;ui.sheet=null;render(true)}});

/* ============ boot ============ */
(function boot(){normCats();
  try{if(window.claude&&window.claude.use)window.claude.use("sample").then(f=>{SAMPLE=f||null;if(ui.tab==="discover"&&!typing())render()}).catch(()=>{})}catch(e){}const t=location.hash.slice(1);if(S.onboarded&&TABS().some(x=>x[0]===t))ui.tab=t;
  if(S.onboarded&&S.settings.pinHash)ui.locked=true;
  if(S.active){ui.tab="intimacy";ui.int.seg="track"}
  render();
  Cloud.init().then(async()=>{
    if(Cloud.state==="ready"&&S.onboarded&&S.user.mode==="account"&&!S.draft){const v=await Cloud.readVault();if(v){mergeVault(v);saveLocal()}Cloud.queueVault()}
    if(Cloud.state==="ready"&&S.onboarded&&S.settings.social)await Soc.start();
    if(!typing())render()});
})();
window.__vouz={buildCard,get S(){return S},Soc,Cloud,K,Photos,RW,R,cardContent,renderCard};
</script>
