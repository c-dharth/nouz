<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. A coral ring is the recurring object: the week on Home, the session in Replay, the clock in Insights. Cards are used only where content needs a container. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0E0B0C; --surface:#1B1718; --surface2:#272123; --line:#3A3133;
  --coral:#C9939B; --pink:#E8CBC6; --text:#F3ECE3; --muted:#BCAFA9; --dim:#988A86;
  --wine:#8C2A43; --burgundy:#561727; --ink:#1C1114;
  --ok:#93C9AA; --warn:#E2BA7C; --danger:#E5867A;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --body:"Schibsted Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:22px; --r-sm:14px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
.scroll:focus{outline:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media(min-width:520px){body{background:#08080b}#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 28px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;border-top:1px solid var(--line);background:rgba(14,11,12,.96);padding:0 6px env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.02em;position:relative;transition:color .15s}
.tab::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--coral);transform:scaleX(0);transition:transform .2s}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{transform:scaleX(1)}
.tab[aria-current="page"] svg{color:var(--coral)}
.tab svg{width:23px;height:23px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mark{font-family:var(--display);font-style:italic;font-size:30px;line-height:1;letter-spacing:-.01em}
.mark b{color:var(--coral);font-weight:400}
h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em{color:var(--pink)}
h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.12;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
p.sub,.sub{color:var(--muted)}
.small{font-size:13px}.tiny{font-size:12px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.line{background:none;border:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.row:first-child{align-items:baseline}
.rule{height:1px;background:var(--line);border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--surface2);color:var(--text);transition:transform .12s,background .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--wine),var(--burgundy));color:var(--text);box-shadow:inset 0 0 0 1px rgba(232,203,198,.14)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid rgba(229,134,122,.5);color:var(--danger)}
.btn.sm{min-height:44px;padding:0 16px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.busy{opacity:.6;pointer-events:none}
.link{color:var(--pink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(232,203,198,.4);min-height:44px;display:inline-flex;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border-radius:var(--r-sm);padding:14px 12px;min-width:0}
.tile b{display:block;font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio div{padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.trio div:first-child{border-left:0;padding-left:0}
.trio b{display:block;font-family:var(--display);font-weight:400;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.trio span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal span.h{color:var(--dim);font-weight:700;aspect-ratio:auto;padding-bottom:2px}
.cal span.on{background:rgba(201,147,155,.2);color:var(--text);font-weight:700}
.cal span.on2{background:var(--coral);color:#1C1114;font-weight:700}
.cal span.today{box-shadow:inset 0 0 0 1.5px var(--pink)}
.sess{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:60px;border-top:1px solid var(--line);width:100%;text-align:left}
.sess:first-of-type{border-top:0}
.sess .d{width:44px;text-align:center;flex:none}
.sess .d b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.sess .d span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sess .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
button.pill{min-height:44px;padding:0 14px}
.pill.c{background:rgba(201,147,155,.16);color:var(--pink)}
.pill.w{background:rgba(226,186,124,.14);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--coral);color:#1C1114}
.seg3{display:flex;background:var(--surface);border-radius:999px;padding:4px}
.seg3 button{flex:1;min-height:40px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
label.f em{font-style:normal;font-weight:500;color:var(--dim);letter-spacing:0}
input[type=text],input[type=search],input[type=number],input[type=datetime-local],input[type=date],input[type=password],textarea{width:100%;min-height:48px;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);padding:12px 14px;font-size:16px;font-weight:500;color:var(--text);letter-spacing:0}
input:focus,textarea:focus{outline:none;border-color:var(--coral)}
textarea{min-height:84px;resize:vertical}
.sw{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;min-height:48px;width:100%;text-align:left}
.sw .k{width:46px;height:28px;border-radius:999px;background:var(--surface2);position:relative;flex:none;transition:background .15s}
.sw .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"] .k{background:var(--coral)}
.sw[aria-checked="true"] .k::after{transform:translateX(18px);background:#1C1114}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 2px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.ib.bare{background:none}
.clock{font-size:54px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stage{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stage .in{position:relative;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stage [data-act]{cursor:pointer}
.stage g:focus-visible{outline:none}
.stage g:focus-visible path.vis{stroke:var(--text)}
.orb{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 35% 30%,#B0475F,var(--burgundy) 72%);color:var(--text);font-weight:800;box-shadow:0 0 0 10px rgba(201,147,155,.08),0 18px 50px rgba(201,147,155,.28);transition:transform .15s}
.orb:active{transform:scale(.96)}
.orb svg{width:38px;height:38px}
.orb.dark{background:var(--surface);color:var(--text);box-shadow:0 0 0 10px rgba(201,147,155,.08)}
.orb .mc{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.live .glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.enter .scroll>*,.enter .ob>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.enter .scroll>*:nth-child(2){animation-delay:.04s}.enter .scroll>*:nth-child(3){animation-delay:.08s}.enter .scroll>*:nth-child(4){animation-delay:.12s}.enter .scroll>*:nth-child(5){animation-delay:.16s}.enter .scroll>*:nth-child(n+6){animation-delay:.2s}
.enter path.seg{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s .15s cubic-bezier(.3,.7,.2,1) forwards}
.enter .badge.on.new{animation:pop .5s .5s both}
.overlay.in{animation:fade .2s both}.overlay.in .sheet{animation:up .28s cubic-bezier(.2,.7,.2,1) both}
.toast{animation:rise .25s both}
.skel{border-radius:var(--r);height:150px;background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 100px,var(--surface) 200px);background-size:400px 100%;animation:shimmer 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.overlay{position:absolute;inset:0;background:rgba(5,5,8,.72);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet:focus{outline:none}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--text);color:#15131c;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:30;text-align:center}
.banner{background:rgba(226,186,124,.12);color:var(--warn);border-radius:var(--r-sm);padding:6px 14px;min-height:44px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.ok{background:rgba(147,201,170,.12);color:var(--ok)}
.ob{flex:1;display:flex;flex-direction:column;padding:26px 24px calc(22px + env(safe-area-inset-bottom));gap:18px;overflow-y:auto}
.ob .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.steps{display:flex;gap:5px}.steps i{height:3px;flex:1;border-radius:3px;background:var(--surface2)}.steps i.on{background:var(--coral)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-sm);border:1.5px solid var(--line);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--coral);background:rgba(201,147,155,.08)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt b{display:block}
.share{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;color:#1C1114}
.share.s0{background:linear-gradient(140deg,#8C2A43,#3E1019);color:var(--text)}
.share.s1{background:linear-gradient(150deg,#3A1621,#1B1718);color:var(--text);box-shadow:inset 0 0 0 1px #5E2A37}
.share.s2{background:linear-gradient(140deg,#E8CBC6,#F3ECE3)}
.share.s3{background:#0E0B0C;color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--coral)}
.share svg.deco{position:absolute;right:-46px;top:-46px;width:190px;height:190px;opacity:.28}
.share .big{position:relative;font-family:var(--display);font-size:34px;line-height:1.02;overflow-wrap:anywhere;max-width:85%}
.share .meta{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13px}
.share .meta span{padding:4px 10px;border-radius:999px;background:rgba(26,8,16,.14)}
.share.s1 .meta span,.share.s3 .meta span{background:rgba(232,203,198,.16);color:var(--pink)}
.share .wm{font-family:var(--display);font-style:italic;font-size:20px;opacity:.8}
.post{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--pink);flex:none}
.feedsec{display:flex;flex-direction:column;gap:12px;margin-top:10px;padding-top:16px;border-top:1px solid var(--line)}.feedhead h3{margin:0}
.post2{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.post2 .ph2{gap:10px;align-items:center}.post2 .ph2 b{display:block}
.av{overflow:hidden}img.av{object-fit:cover;padding:0}.av.lg{width:72px;height:72px;font-size:26px}
.link-u{font:inherit;color:var(--text);padding:0;min-height:0;background:none;text-align:left}
.pmg{display:grid;gap:4px;border-radius:14px;overflow:hidden;margin:0 -2px}.pmg.n2,.pmg.n4{grid-template-columns:1fr 1fr}.pmg.n3{grid-template-columns:2fr 1fr}.pmg.n3 .pm:first-child{grid-row:span 2}
.pm{background:var(--surface2);aspect-ratio:1;position:relative;min-height:120px}.pmg.n1 .pm{aspect-ratio:4/5;max-height:62vh}
.pm img,.pm video{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}.pm.ok img,.pm.ok video{opacity:1}.pm video{object-fit:contain;background:#000}
.pm:not(.ok):not(.gone)::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--surface2) 0,var(--surface) 80px,var(--surface2) 160px);background-size:320px 100%;animation:shimmer 1.3s linear infinite}
.pm.gone::after{content:"Media unavailable";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--dim)}
.ptitle{display:flex;flex-direction:column;gap:2px}.ptitle .tiny{text-transform:uppercase;letter-spacing:.08em;color:var(--pink)}.ptitle b{font-family:var(--serif,inherit);font-size:19px;line-height:1.2}
.pcap{overflow-wrap:anywhere;line-height:1.45}
.pact{display:flex;align-items:center;gap:2px;margin:0 -8px}.pact button{min-height:44px;min-width:44px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:13px;border-radius:999px}
.pact button[aria-pressed="true"]{color:var(--pink)}.pact button[data-act="like"][aria-pressed="true"] svg{fill:var(--pink)}
.why{color:var(--dim);align-self:flex-start;min-height:32px}p.why{line-height:1.45}
.pcm{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.phead{display:flex;gap:16px;align-items:center}
.ib{position:relative}.ib .dot{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--wine,#7A2E3B);color:var(--text);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.hist.need{border-left:3px solid var(--pink);padding-left:10px}
.warn-t{color:var(--warn)}.skel.tall{height:320px}
.tabs .tab{font-size:10px;min-width:0}
.chips.scrollx{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}.chips.scrollx::-webkit-scrollbar{display:none}.chips.scrollx .chip{flex:none}
input[type=search]{-webkit-appearance:none;appearance:none}
.wx{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface)}.wx>span:first-child{font-weight:700}
.gq{align-self:flex-end;max-width:85%;background:var(--surface2);padding:10px 12px;border-radius:14px 14px 4px 14px;overflow-wrap:anywhere}
.ga{gap:8px}.gsum{white-space:pre-wrap;font-size:11px;color:var(--dim);max-height:240px;overflow:auto;margin:6px 0 0}
.itabs{margin-top:4px}.fcwrap{display:flex;flex-direction:column;gap:16px}
.fcard{--fg:#5A2230;position:relative;display:flex;flex-direction:column;gap:6px;padding:44px 22px 22px;border-radius:24px;overflow:hidden;min-height:340px;justify-content:flex-end;
 background:radial-gradient(120% 80% at 80% 10%,color-mix(in srgb,var(--fg) 85%,transparent),transparent 70%),linear-gradient(180deg,#160D10,#0E0B0C);border:1px solid rgba(244,236,230,.06)}
.fcard .fk{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--pink)}
.fcard .fw{font-family:var(--serif,"Instrument Serif",Georgia,serif);font-size:clamp(52px,17vw,96px);line-height:.92;letter-spacing:-.01em;color:#F4ECE6;overflow-wrap:anywhere;animation:fcin .9s ease both}
.fcard .fl{font-family:var(--serif,"Instrument Serif",Georgia,serif);font-style:italic;font-size:20px;line-height:1.3;color:#E8CBC6;max-width:30ch}
.fcard .fd{font-size:12px;color:var(--dim);margin-top:10px}.fcard .fb{position:absolute;top:18px;left:22px;font-size:10px;font-weight:800;letter-spacing:.2em;color:rgba(244,236,230,.55)}
.fload .fw{height:88px;border-radius:12px;width:70%}
@keyframes fcin{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.fcard .fw{animation:none}}
.fdims{display:flex;flex-direction:column;gap:12px}.fdim{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fdots{display:inline-flex;gap:5px}.fdots i{width:8px;height:8px;border-radius:50%;background:rgba(244,236,230,.12)}.fdots i.on{background:var(--pink)}
.fsec{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}.fsec p{font-size:16px;line-height:1.5}
.ftag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}.ftag.observed{color:var(--pink);border-color:rgba(201,147,155,.4)}
.fmove{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:18px;background:var(--surface);text-align:left;position:relative}.fmove b{font-size:17px;padding-right:30px}.fmove svg{position:absolute;right:16px;top:50%;transform:translateY(-50%)}
.fq{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:18px;line-height:1.35;padding:6px 0}

<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const DAY=864e5, WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const startOfWeek=t=>{const d=new Date(startOfDay(t));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const fmtClock=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+"h "+pad(m)+"m":m?m+"m"+(x&&m<10?" "+x+"s":""):x+"s"};
const fmtMin=s=>{const m=s/60;return m>=10?Math.round(m):Math.round(m*10)/10};

  ready(){return S.settings.social&&Cloud.state==="ready"&&K.ok&&!!K.priv&&this.status==="ready"},

  /* Called when a session is deleted or a person is taken off it: withdraw what I sent, or tell the sender I'm out. */

  /* Seal a card: random content key, body encrypted with it, key wrapped for me only. Recipients are added by reconcile(). */
  async seal(id,body,aud,postedAt){const raw=crypto.getRandomValues(new Uint8Array(32)),ck=await K.aes(raw),c=await K.encJ(ck,body),self=await K.enc(K.self,raw),au=await K.encJ(K.self,{aud});

  /* The only place recipient keys are granted or withdrawn. Runs after every change to connections, permissions, blocks or audiences. */
  async reconcile(){const me=Cloud.uid,cur=this.posts[me];if(!cur||!cur.items||this.reconciling)return;let changed=false;const out=[],conns=this.conns();

};

/* ============ sanitized share card: a whitelist, never a copy of the session ============ */
function buildCard(o,sess){
  const c={style:[0,1,2,3,4,5].includes(o.style)?o.style:0,title:String(o.title||"").slice(0,60)};
  if(o.kind==="recap"&&sess){
    if(o.showDuration){c.duration="About "+Math.max(5,Math.round(sess.durationSec/300)*5)+" min";c.arc=Math.min(60,Math.max(5,Math.round(sess.durationSec/300)*5))}
    if(o.showCategory&&CATS[sess.category])c.category=CATS[sess.category];
  }
  if(o.badge)c.badge=String(o.badge).slice(0,40);
  return c;
}

function stats(list){const n=list.length,tot=list.reduce((a,s)=>a+s.durationSec,0);return{n,tot,avg:n?tot/n:0,longest:list.reduce((a,s)=>Math.max(a,s.durationSec),0),days:new Set(list.map(s=>dayKey(s.start))).size}}

const ACH=[
 {id:"first",name:"First Round",desc:"Your first tracked session.",g:"1"},
 {id:"double",name:"Double Take",desc:"A second session in the books.",g:"2"},
 {id:"owl",name:"Night Owl",desc:"A session that started after 10pm.",g:"N"},
 {id:"early",name:"Early Riser",desc:"A session that started before 9am.",g:"E"},
 {id:"weekend",name:"Weekend Energy",desc:"A Saturday or Sunday session.",g:"W"},
 {id:"century",name:"Century Club",desc:"100 tracked minutes, all told.",g:"C"},
 {id:"ten",name:"Ten Down",desc:"Ten sessions tracked.",g:"X"},
 {id:"story",name:"Dear Diary",desc:"A session with a private note or reflection.",g:"D"},
 {id:"regular",name:"The Regular",desc:"A rhythm you set for yourself.",g:"R"}
];
function achievements(){
  const ss=S.sessions.slice().sort((a,b)=>a.start-b.start),u={};
  const first=f=>ss.find(f);
  if(ss[0])u.first=ss[0]; if(ss[1])u.double=ss[1]; if(ss[9])u.ten=ss[9];
  u.owl=first(s=>{const h=new Date(s.start).getHours();return h>=22||h<4});
  u.early=first(s=>{const h=new Date(s.start).getHours();return h>=5&&h<9});
  u.weekend=first(s=>[0,6].includes(new Date(s.start).getDay()));
  u.story=first(s=>(s.notes&&s.notes.trim())||(s.reflection&&s.reflection.trim()));
  let cum=0;for(const s of ss){cum+=s.durationSec;if(cum>=6000){u.century=s;break}}
  const g=S.settings.regular;
  if(g){const wk={};ss.forEach(s=>{const k=startOfWeek(s.start);(wk[k]=wk[k]||[]).push(s)});
    const keys=Object.keys(wk).map(Number).sort((a,b)=>a-b);let run=0,prev=null;
    for(const k of keys){const ok=wk[k].length>=g.perWeek;
      if(ok){run=(prev!==null&&Math.round((k-prev)/DAY)===7)?run+1:1;prev=k;if(run>=g.weeks){u.regular=wk[k][g.perWeek-1];break}}else{run=0;prev=null}}}
  return ACH.map(a=>({...a,desc:a.id==="regular"&&g?g.perWeek+" or more a week, "+g.weeks+" weeks running.":a.desc,at:u[a.id]||null}));
}
function milestonesFor(s){const out=[];achievements().forEach(a=>{if(a.at&&a.at.id===s.id)out.push({t:a.name,d:a.desc,g:a.g})});
  const before=S.sessions.filter(x=>x.start<s.start);
  if(before.length&&s.durationSec>Math.max(...before.map(x=>x.durationSec)))out.push({t:"Longest so far",d:"Your longest tracked session up to that day.",g:"L"});
  const n=before.length+1;if([5,25,50,100,250].includes(n))out.push({t:"Session "+n,d:n+" sessions tracked.",g:"#"});
  return out}
function summaryFor(s){const d=new Date(s.start),h=d.getHours();const part=h<5?"night":h<12?"morning":h<17?"afternoon":h<22?"evening":"night";
  const m=Math.round(s.durationSec/60);return (m<1?"Under a minute":m+" minute"+(m===1?"":"s"))+" on a "+WDL[d.getDay()]+" "+part+"."}

const polar=(cx,cy,r,a)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
function arc(cx,cy,r,a0,a1){const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);return`M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
const arcLen=(r,a0,a1)=>(r*(a1-a0)*Math.PI/180+2).toFixed(1);
const GRAD='<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9939B"/><stop offset="1" stop-color="#E8CBC6"/></linearGradient></defs>';
/* Home: the week as a ring of seven arcs, Monday at the top. */
function weekRing(ws,cd,sel){const cx=160,cy=160,r=114,gap=7,step=360/7,today=dayKey(Date.now());let g="";
  for(let i=0;i<7;i++){const t=addDays(ws,i),k=dayKey(t),c=cd[k]||0,a0=i*step+gap/2,a1=(i+1)*step-gap/2,[lx,ly]=polar(cx,cy,r+27,(a0+a1)/2),d=arc(cx,cy,r,a0,a1);
    g+=`<g data-act="pickDay" data-i="${i}" tabindex="0" role="button" aria-pressed="${sel===i}" aria-label="${fmtDate(t)}, ${c} session${c===1?"":"s"}"><path d="${d}" stroke="transparent" stroke-width="46" fill="none" pointer-events="stroke"/><path class="vis${c?" seg":""}" d="${d}" stroke="${c?"url(#rg)":"#272123"}" stroke-width="${sel===i?22:14}" fill="none" stroke-linecap="round" style="--len:${arcLen(r,a0,a1)}"/>${c>1?`<circle cx="${polar(cx,cy,r,(a0+a1)/2)[0].toFixed(1)}" cy="${polar(cx,cy,r,(a0+a1)/2)[1].toFixed(1)}" r="3.5" fill="#1C1114"/>`:""}</g><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${k===today?"#E8CBC6":"#988A86"}">${WD[new Date(t).getDay()][0]}</text>`}
  return`<svg viewBox="0 0 320 320">${GRAD}${g}</svg>`}
/* Replay: the session as one 300-degree ring, active stretches drawn, pauses left open. */
function replayRing(s,sel){const segs=s.segments&&s.segments.length?s.segments:[[0,1]],t0=segs[0][0],t1=segs[segs.length-1][1],span=Math.max(1,t1-t0),A=300,off=-150,cx=160,cy=160,r=124;
  let p=`<path d="${arc(cx,cy,r,off,off+A)}" stroke="#272123" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  segs.forEach(([a,b],i)=>{const x0=off+A*(a-t0)/span,x1=Math.max(off+A*(b-t0)/span,x0+.6);p+=`<path class="seg" d="${arc(cx,cy,r,x0,x1)}" stroke="url(#rg)" stroke-width="${sel===i?20:14}" opacity="${sel===null||sel===undefined||sel===i?1:.45}" fill="none" stroke-linecap="round" style="--len:${arcLen(r,x0,x1)}"/>`});
  return`<svg viewBox="0 0 320 320" role="img" aria-label="Session timeline ring">${GRAD}${p}</svg>`}

function bars(vals,labels,unit,color){const W=320,H=150,L=26,B=22,T=10,max=Math.max(1,...vals),n=vals.length,bw=(W-L-4)/n,ticks=max<=4?Math.ceil(max):4;let g="";

  vals.forEach((v,i)=>{const h=(H-T-B)*v/max,x=L+i*bw+bw*.18,w=bw*.64;if(v>0)g+=`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2).toFixed(1)}" fill="${color||"#C9939B"}"><title>${esc(labels[i].full)}: ${v} ${unit}</title></rect>`;

  let g=`<line x1="${L}" x2="${W}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="#3A3133"/><line x1="${L}" x2="${W}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="#3A3133"/><text x="${L-6}" y="${Y(mx)+4}" text-anchor="end" font-size="10" fill="#988A86">${mx}</text><text x="${L-6}" y="${Y(mn)+4}" text-anchor="end" font-size="10" fill="#988A86">${mn}</text>`;

function heatmap(list,weeks){const m=countByDay(list),end=addDays(startOfWeek(Date.now()),6),start=addDays(end,-(weeks*7-1));let h="";
  for(let t=start,i=0;i<weeks*7;i++,t=addDays(t,1)){const c=m[dayKey(t)]||0;h+=`<i class="${c?"l"+Math.min(3,c):""}${t>Date.now()?" f":""}" title="${fmtDate(t)}: ${c} session${c===1?"":"s"}"></i>`}
  return`<div class="hm" style="grid-template-columns:repeat(${weeks},1fr)">${h}</div>`}
/* Insights: a 24-hour dial, midnight at the top, one spoke per starting hour. */
function dial(list){const cx=150,cy=150,r0=50,r1=112,by=Array(24).fill(0);list.forEach(s=>by[new Date(s.start).getHours()]++);const max=Math.max(1,...by);
  let g=`<circle cx="${cx}" cy="${cy}" r="${r0-8}" fill="none" stroke="#3A3133"/><circle cx="${cx}" cy="${cy}" r="${r1+4}" fill="none" stroke="#3A3133" stroke-dasharray="2 5"/>`;
  by.forEach((c,h)=>{const a=h*15+7.5,[x0,y0]=polar(cx,cy,r0,a),[x1,y1]=polar(cx,cy,r0+(r1-r0)*(c/max),a);
    g+=c?`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="url(#rg)" stroke-width="9" stroke-linecap="round"><title>${h%12||12}${h<12?"am":"pm"}: ${c} session${c===1?"":"s"}</title></line>`:`<circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="2" fill="#3A3133"/>`});

const CATS={couple:"Couple",poly:"Poly"},CAT_PICK=["couple","poly"],CAT_ALL=["couple","poly"],PMAX=20;
const CATC={couple:"var(--coral)",poly:"#C9A27E"};
const clampP=n=>Math.min(PMAX,Math.max(3,Math.round(+n)||3));

const LEGACY=["solo","partnered"];
function convCat(c,n){if(c==="couple"||c==="duo")return{category:"couple",participants:2};if(c==="poly")return{category:"poly",participants:clampP(n)};
  if(c==="trio")return{category:"poly",participants:3};if(c==="group")return{category:"poly",participants:clampP(+n>=4?n:4)};return{category:null,participants:null}}

  for(const a of [S.active,S.draft])if(a&&a.category&&!LEGACY.includes(a.category)){const c=convCat(a.category,a.participants??a.groupSize);a.category=c.category;a.participants=c.participants;delete a.groupSize}
  for(const a of [S.active,S.draft])if(a&&LEGACY.includes(a.category)){a.category="couple";a.participants=2}}
const legacySessions=()=>S.sessions.filter(s=>!s.demo&&LEGACY.includes(s.category));
/* Status of the people on a session. Declining takes someone off the list, so they don't hold it at Pending. */
function verifyStatus(s){const pp=(s.people||[]).filter(p=>p.from||(Soc.inv[p.id+"|"+p.i]||"wait")!=="no");

async function hashPin(pin,salt,alg){try{if(alg==="pbkdf2"){const k=await crypto.subtle.importKey("raw",te.encode(pin),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:te.encode(salt),iterations:150000},k,256))}
    return hex(await crypto.subtle.digest("SHA-256",te.encode(salt+":"+pin)))}catch(e){let x=5381;for(const c of te.encode(salt+":"+pin))x=((x<<5)+x+c)>>>0;return "f"+x.toString(16)}}

/* REWARDS-START — VOUZ Points, badges, levels and weekly challenges.
   Every point comes from a record that exists right now, under a key that can only ever be awarded once
   ("exp:<id>", "cat:dinner", "ses:<week>"…). Nothing is stored as a running total, so a point can't be
   awarded twice, deleting a record takes its points back, and creating and deleting to farm points nets nothing.
   Daily and weekly caps stop rapid logging from earning more. Intimacy earns at most once a week, the same for one
   session or ten, so how often, how long or how many people never earns more. */
const RW=(()=>{
  /* Configurable values. Starting points, not an economy. */
  const VP={memory:20,newKind:50,planDone:75,bucket:100,session:10,confirmed:10,challenge:150};
  const CAPS={memoriesPerDay:3,plansPerDay:2,sessionWeeks:1,challengesPerWeek:1};
  const LEVELS=[[0,"Spark"],[100,"Kindling"],[250,"Ember"],[450,"Glow"],[700,"Flame"],[1000,"Hearth"],[1400,"Lantern"],[1900,"Beacon"],[2500,"Comet"],[3200,"Constellation"],[4000,"Aurora"],[5000,"Starlight"]];
  const KINDS={dinner:"Dinner date",trip:"Trip",adventure:"Adventure",movie:"Movie",celebration:"Celebration",romantic:"Romantic",milestone:"Milestone",other:"Other"};
  const pad=n=>String(n).padStart(2,"0");
  const dayK=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  /* Monday-to-Sunday weeks in local time, as a whole number. */
  const week=t=>{const d=new Date(t),n=Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);return(n-(d.getDay()+6)%7-4)/7};
  const weekStart=w=>{const u=new Date((w*7+4)*864e5);return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate()).getTime()};
  const made=e=>e.createdAt||e.date||0;
  const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");

  /* Weekly challenges: none involve intimacy, and none keep a streak. */
  const CHALLENGES=[
    {id:"newrest",t:"Try a new restaurant",d:"Log a dinner date somewhere new to you both.",kinds:["dinner"],newPlace:true,b:2,e:1,g:["food"]},
    {id:"newplace",t:"Go somewhere neither of you has been",d:"Log a memory with a place you haven't logged before.",newPlace:true,b:1,e:2,g:["adventure","culture"]},
    {id:"screenfree",t:"Plan a screen-free date",d:"Phones away from start to finish.",attest:"No phones or screens for the whole date",b:0,e:1,g:["romance","home"]},
    {id:"cook",t:"Cook a new recipe together",d:"Something neither of you has made.",attest:"You cooked it together",kinds:["dinner","romantic","other"],b:1,e:1,g:["food","home"]},

  else{if(!Soc.ready())body=`<div class="card"><h2>Pick privately. <em>Match together.</em></h2><p class="sub">Each of you chooses what you'd like to do, without seeing the other's choices. VOUZ shows only what everyone picked.</p><p class="sub small">${S.settings.social?"Connections can't be reached right now.":"This needs Connections, which is off. Turn it on in Profile, connect with your partner, and create a shared space."}</p><button class="btn sm" style="align-self:flex-start" data-act="tab" data-tab="profile">Profile</button></div>`;

Object.assign(A,{
  iSeg(e){ui.int.seg=e.dataset.v;render(true)},

    S.exps.push({id:uid(),kind:"plan",title:x.t,date:null,cat:"other",location:"",favorite:"",mood:"",notes:"",sharedNote:"",space:null,anniv:false,photos:[],idea:x.id,createdAt:now,updatedAt:now});save();render();toast("Saved to your plans.")},
  matchSave(e){const x=IDEA[e.dataset.v],sp=ui.disc.space;if(!x||!Soc.sp[sp])return;const now=Date.now();
    S.exps.push({id:uid(),kind:"plan",title:x.t,date:null,cat:"other",location:"",favorite:"",mood:"",notes:"",sharedNote:"",space:sp,anniv:false,photos:[],idea:x.id,createdAt:now,updatedAt:now});save();Soc.sched();render();toast("Planned. Everyone in "+Soc.sp[sp].name+" can see it.")},
  pickSpace(e){ui.disc.space=e.dataset.v;render()},
  pickToggle(e){const sp=ui.disc.space;if(!Soc.sp[sp])return;const cur=S.picks[sp]||[],v=e.dataset.v;if(!cur.includes(v)&&cur.length>=PSI.CAP)return toast("Up to "+PSI.CAP+" picks.");S.picks[sp]=cur.includes(v)?cur.filter(x=>x!==v):cur.concat([v]);save();buzz(8);Soc.sched();render()},
  planSched(e){const x=S.exps.find(z=>z.id===e.dataset.id);if(!x)return;ui.err="";sheet({type:"sched",id:x.id,val:x.date?toLocalInput(x.date):""})},

    x.updatedAt=Date.now();ui.sheet=null;ui.err="";save();Soc.sched();render();toast(x.date?"Scheduled for "+fmtDate(x.date)+".":"Unscheduled.")},
  planDone(e){const x=S.exps.find(z=>z.id===e.dataset.id);if(!x)return;ui.xd={...blankX("done"),editing:x.id,fromPlan:true,title:x.title,date:dayKey(x.date&&x.date<=Date.now()?x.date:Date.now()),cat:x.cat==="other"&&x.idea?"adventure":x.cat,location:x.location||"",notes:x.notes||"",sharedNote:x.sharedNote||"",space:x.space||null,photos:(x.photos||[]).slice(),idea:x.idea};
    if(x.idea){const it=IDEA[x.idea];ui.xd.cat=it.g.includes("food")?"dinner":it.g.includes("romance")?"romantic":it.ds==="away"?"trip":it.g.includes("music")||it.g.includes("culture")?"celebration":"adventure"}

  expNew(e){ui.xd=blankX(e.dataset.kind||"done");ui.err="";openPage({type:"expEdit",from:ui.page})},

/* ---------------- AI date planner (asks Claude through the platform; the viewer approves the first call) ---------------- */
let SAMPLE=null;
const PLAN_EX=["What should we do tonight?","Find something romantic nearby","Plan a date under $50","Suggest something we haven't tried","Help plan our anniversary"];
const PB=[["","Any budget"],["0","Free"],["50","Under $50"],["100","Under $100"],["250","Under $250"]],PT=[["","Any time"],["1","About an hour"],["3","A few hours"],["day","A whole day"],["weekend","A weekend"]];
function plannerPrompt(p){const titles=p.history?S.exps.filter(e=>!e.demo).map(e=>(e.kind==="plan"?"planned: ":"done: ")+String(e.title).slice(0,60)).slice(0,40):[];
  return["You are the date planner inside VOUZ, a private app where couples and partners plan time together.",
    "Suggest 3 to 5 experiences for them that fit the request.",
    "Rules: do not name specific businesses or claim anything about a real place's opening hours, prices, reservations, events or availability; describe kinds of places instead (\"a small wine bar\", \"a trail with a view\"), so they can look up real places themselves. Never say you have booked, bought, reserved or contacted anything: you can't. Keep it warm, tasteful and non-explicit. Respect the budget and time if given. If an area is given, fit suggestions to that kind of area without inventing venues.",
    'Reply with only JSON: {"suggestions":[{"title":"under 60 characters","why":"one sentence, under 160 characters","cost":"Free" or "$" or "$$" or "$$$","time":"short, e.g. 2 hours","setting":"Indoors" or "Outdoors" or "Either","steps":["up to 4 short steps"]}]}',
    "",
    "Request: "+(p.q.trim()||"Suggest something good to do together."),
    "Budget: "+(PB.find(x=>x[0]===p.budget)||PB[0])[1],
    "Time available: "+(PT.find(x=>x[0]===p.time)||PT[0])[1],
    p.area.trim()?"Area (typed by them): "+p.area.trim().slice(0,60):"Area: not given",
    titles.length?"Already done or planned, avoid repeating these:\n- "+titles.join("\n- "):""].filter(s=>s!=="").join("\n")}
function cleanPlans(v){const arr=v&&Array.isArray(v.suggestions)?v.suggestions:Array.isArray(v)?v:[];const str=(x,n)=>typeof x==="string"?x.trim().slice(0,n):"";
  return arr.map(x=>({title:str(x&&x.title,60),why:str(x&&x.why,160),cost:["Free","$","$$","$$$"].includes(x&&x.cost)?x.cost:"",time:str(x&&x.time,30),setting:["Indoors","Outdoors","Either"].includes(x&&x.setting)?x.setting:"",steps:Array.isArray(x&&x.steps)?x.steps.map(s=>str(s,100)).filter(Boolean).slice(0,4):[]})).filter(x=>x.title).slice(0,5)}
const PLAN_ERR={rate_limited:"Too many requests right now. Try again in a little while.",refused:"Claude couldn't help with that one. Try asking a different way.",session_expired:"You've been signed out. Sign in again to use the planner.",prompt_too_large:"That request is too long. Try something shorter."};

     <div class="chips sm" role="group" aria-label="Examples">${PLAN_EX.map((t,i)=>`<button class="chip" data-act="plEx" data-i="${i}">${esc(t)}</button>`).join("")}</div>
     <div class="col" style="gap:6px"><span class="tiny">Budget</span><div class="chips sm" role="group" aria-label="Budget">${chip("budget",PB)}</div></div>
     <div class="col" style="gap:6px"><span class="tiny">Time you have</span><div class="chips sm" role="group" aria-label="Time">${chip("time",PT)}</div></div>

     ${sw("plHist",p.history,"Avoid repeats","Also sends the titles of your memories and plans, so it suggests something new.")}
     <p class="tiny">Sent to Claude: your request, budget, time${p.area.trim()?", the area you typed":""}${p.history?" and the titles of your memories and plans":""}. Never your intimacy records, notes, photos, partners or location.</p>
     ${p.busy?`<div class="row"><span class="grow sub" role="status">Thinking…</span><button class="btn sm ghost" data-act="plStop">Stop</button></div>`:`<button class="btn primary block" data-act="plAsk">${ic("spark")} Get ideas</button>`}</div>
   ${p.err?`<p class="err" role="alert">${esc(p.err)}</p>`:""}
   ${p.res?(p.res.length?p.res.map((x,i)=>{const saved=S.exps.some(e=>e.kind==="plan"&&e.title===x.title);return`<div class="card idea"><div><b class="it">${esc(x.title)}</b>${x.why?`<p class="sub small">${esc(x.why)}</p>`:""}<p class="tiny">${[x.cost,x.time,x.setting].filter(Boolean).map(esc).join(" · ")}</p>${x.steps.length?`<ol class="steps-l">${x.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}</div><button class="btn sm ${saved?"ghost":""}" style="align-self:flex-start" data-act="plSave" data-i="${i}" ${saved?"disabled":""}>${saved?ic("check")+" In your plans":ic("plus")+" Save to plans"}</button></div>`}).join("")+`<p class="tiny">Ideas only. Nothing here has been checked for opening hours, prices or availability, and the planner can't book, buy or message anyone.</p><button class="link small" data-act="plAsk" data-again="1">Try again</button>`:`<div class="card line"><p class="sub small">No ideas came back. Try asking a different way.</p></div>`):""}`}

async function coupleHash(c){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify([c.id,[c.a,c.b].sort(),c.data])))).slice(0,24)}
const cleanCouple=d=>({name:String(d.name||"").slice(0,40),bio:String(d.bio||"").slice(0,200),photo:typeof d.photo==="string"&&d.photo.startsWith("data:image/jpeg;base64,")&&d.photo.length<60000?d.photo:"",favs:(d.favs||[]).filter(f=>IDEA[f]).slice(0,6),badges:(d.badges||[]).filter(b=>RW.BADGES.some(x=>x.id===b)).slice(0,6)});
Object.assign(Soc,{media:{},couplesLive:{},couplesPending:[],coupleMine:null,
  blockedMe(a){const r=this.rel[a];return!!(r&&((this.links[a]||{}).bl||[]).includes(r.in))},
  async readCouples(){const me=Cloud.uid,live={},pend=[];let mine=null;
    for(const u in this.couples){if(S.blocks.includes(u))continue;for(const c of ((this.couples[u]||{}).items||[])){if(!c||!c.id||!c.with||c.with===u)continue;
      const other=((this.couples[c.with]||{}).items||[]).find(x=>x&&x.id===c.id&&x.with===u);const data=cleanCouple(c.data||{}),h=await coupleHash({id:c.id,a:u,b:c.with,data});
      if(h!==c.h)continue;
      if(other&&other.h===c.h){live[c.id]={id:c.id,members:[u,c.with].sort(),data,h};if(u===me||c.with===me)mine=live[c.id]}
      else if(c.with===me)pend.push({id:c.id,from:u,data,h,item:c})}}
    this.couplesLive=live;this.couplesPending=pend;this.coupleMine=mine||null;
    const myItem=((this.couples[me]||{}).items||[])[0];if(!mine&&myItem)this.coupleMine={id:myItem.id,members:[me,myItem.with].sort(),data:cleanCouple(myItem.data),h:myItem.h,waiting:true}},
  coupleOf(u){return Object.values(this.couplesLive).find(c=>c.members.includes(u))||null},
  /* A post shown as a couple's needs the partner's approval for that exact post. */
  coupleOk(x){if(!x.it.co)return true;const c=this.couplesLive[x.it.co];if(!c||!c.members.includes(x.a))return false;const p=c.members.find(u=>u!==x.a);return((this.couples[p]||{}).postOk||[]).includes(x.key)}
});

function myInterests(){const g=new Set(S.settings.chPrefs.interests||[]);for(const e of S.exps)if(!e.demo&&e.idea&&IDEA[e.idea])IDEA[e.idea].g.forEach(x=>g.add(x));const cats=new Set(S.exps.filter(e=>!e.demo).map(e=>e.cat));return{g,cats}}
function likeCount(key){let n=0;for(const u in Soc.reactions){if(S.blocks.includes(u))continue;const v=(Soc.reactions[u].r||{})[key];if(v)n++}return n}
function likedByMe(key){return!!((Soc.reactions[Cloud.uid]||{}).r||{})[key]}
function scorePost(x,ctx){const age=(Date.now()-(x.it.postedAt||0))/36e5,rec=Math.round(40*Math.pow(.5,age/72)),eng=Math.min(25,Math.round(10*Math.log2(1+likeCount(x.key)+2*(Soc.cm[x.key]||[]).length)));
  const it=x.it,idea=it.idea&&IDEA[it.idea],intr=(idea&&idea.g.some(g=>ctx.g.has(g)))||(it.cat&&ctx.cats.has(it.cat))?15:0,qual=((it.media||[]).length?5:0)+(String(it.caption||"").length>=30?3:0)+(it.loc?2:0);
  return{rec,eng,intr,qual,total:rec+eng+intr+qual}}
function feedFilter(list,f){const q=String(f.q||"").trim().toLowerCase();return list.filter(x=>{const it=x.it;if(f.kind&&f.kind!=="all"){const k=f.kind==="media"?["photo","video"].includes(it.kind):it.kind===f.kind;if(!k)return false}
  if(!q)return true;return[it.title,it.caption,it.loc,Soc.handle(x.a),it.co&&Soc.couplesLive[it.co]?Soc.couplesLive[it.co].data.name:""].some(v=>String(v||"").toLowerCase().includes(q))})}
function visiblePosts(){return Soc.items.filter(x=>x.a===Cloud.uid||(!S.blocks.includes(x.a)&&!Soc.blockedMe(x.a)&&Soc.coupleOk(x)))}
function exploreList(){const f=ui.feed,ctx=myInterests(),pub=feedFilter(visiblePosts().filter(x=>!x.sealed&&x.a!==Cloud.uid),f);
  if(f.mode==="latest")return pub.map(x=>({x,s:null}));
  const scored=pub.map(x=>({x,s:scorePost(x,ctx)})).sort((a,b)=>b.s.total-a.s.total),seen={},out=[];
  for(const r of scored){const n=seen[r.x.a]=(seen[r.x.a]||0)+1;r.s.div=n>1?-12*(n-1):0;r.s.total+=r.s.div}   // no author fills the feed
  return scored.sort((a,b)=>b.s.total-a.s.total)}
function friendsList(){const fr=new Set(Soc.conns());return visiblePosts().filter(x=>fr.has(x.a)||x.it.co&&Soc.couplesLive[x.it.co]&&Soc.couplesLive[x.it.co].members.some(u=>fr.has(u))&&x.a!==Cloud.uid)}

      const m=typeof p==="string"&&p.match(/Coordinates:\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);return m?{lat:+(+m[1]).toFixed(3),lon:+(+m[2]).toFixed(3)}:null}catch(e){return null}}};

/* ---------- requests in plain words ---------- */
function parseAsk(s){const t=String(s||"").toLowerCase(),q={raw:String(s||"").slice(0,200),kinds:[]};let m;
  if((m=t.match(/within\s+(\d+(?:\.\d+)?)\s*(mi|mile|miles|km|kilomet)/)))q.km=+m[1]*(m[2].startsWith("k")?1:1.609);
  else if(/walking distance|walkable/.test(t))q.km=1.6;else if(/nearby|close by|near (us|me)/.test(t))q.km=q.km||5;
  if((m=t.match(/(?:under|less than|below|max|up to)\s*\$?\s*(\d+)/))||(m=t.match(/\$\s*(\d+)/)))q.budget=+m[1];else if(/\bfree\b|no money|cheap/.test(t))q.budget=/free|no money/.test(t)?0:30;
  const W={one:1,two:2,three:3,four:4,five:5,six:6,an:1,a:1};if((m=t.match(/(\d+(?:\.\d+)?|one|two|three|four|five|six|an|a)\s*(?:hours?|hrs?)/)))q.hours=W[m[1]]||+m[1];
  if(/romantic|romance|intimate|candle/.test(t))q.mood="romance";if(/adventur|thrill|active/.test(t))q.mood="adventure";if(/bored|fun|play|silly/.test(t))q.mood=q.mood||"fun";if(/relax|chill|calm|low.?key/.test(t))q.mood=q.mood||"calm";
  if(/tonight|right now|now\b|spontaneous|this evening/.test(t))q.now=true;if(/haven.?t (tried|done)|new to us|something new|never tried|different/.test(t))q.novel=true;
  if(/public trans|transit|bus|train|subway|metro|bart|no car/.test(t))q.transit=true;
  for(const[k,re] of DTERMS)if(re.test(t))q.kinds.push(k);
  if(q.mood==="romance"&&!q.kinds.length)q.kinds=["drinks","food","outdoors","culture"];if(q.mood==="adventure"&&!q.kinds.length)q.kinds=["adventure","trail","outdoors"];
  if(q.mood==="fun"&&!q.kinds.length)q.kinds=["games","music","adventure"];if(q.mood==="calm"&&!q.kinds.length)q.kinds=["coffee","outdoors","wellness","culture"];
  q.plan=/\bplan\b|itinerary|our (saturday|sunday|day|evening|night|weekend)|day out|date (night|plan)/.test(t);
  const days=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];const dm=days.findIndex(d=>t.includes(d));if(dm>=0)q.day=dm;else if(/tomorrow/.test(t))q.day="tomorrow";else if(/tonight|today|this evening/.test(t))q.day="today";
  if(/tonight|evening|night|dinner/.test(t))q.daypart="evening";else if(/morning|brunch|breakfast/.test(t))q.daypart="morning";
  const kw=t.replace(/within.*?(mi|miles|km)\b|under \$?\d+|\$\d+|\d+ hours?/g," ").match(/(?:find|suggest|want|looking for|some)\s+(?:a |an |some )?([a-z][a-z\s-]{2,30}?)(?:\s+(?:near|nearby|tonight|under|within|for|that|in)\b|$)/);
  if(kw&&!/something|anything|thing|place/.test(kw[1]))q.term=kw[1].trim();
  return q}

/* ---------- what each person likes: built only from what they did and said in VOUZ, never from intimacy records ---------- */
function myTaste(){const w={};const add=(g,v)=>{if(INTS[g])w[g]=(w[g]||0)+v};
  (S.settings.chPrefs.interests||[]).forEach(g=>add(g,3));
  if(S.disc.learn!==false){for(const e of S.exps){if(e.demo)continue;if(e.idea&&IDEA[e.idea])IDEA[e.idea].g.forEach(g=>add(g,e.kind==="done"?1.5:.8));const k=e.venue&&e.venue.kind;if(k)(DGROUPS[k]||[]).forEach(g=>add(g,e.kind==="done"?(e.rating?e.rating-2.5:1):.5))}
    for(const v of (S.disc.saved||[]))(DGROUPS[v.kind]||[]).forEach(g=>add(g,.8));
    for(const[k,n] of Object.entries(S.disc.kinds||{}))(DGROUPS[k]||[]).forEach(g=>add(g,n*.7))}
  const max=Math.max(1,...Object.values(w).map(Math.abs)),norm={};for(const g in w)norm[g]=+(w[g]/max).toFixed(2);
  const spent=S.exps.filter(e=>!e.demo&&e.venue&&e.venue.price).map(e=>e.venue.price);
  return{w:norm,price:spent.length?Math.round(spent.reduce((a,b)=>a+b,0)/spent.length):null,km:S.disc.maxKm||null,avoid:Object.keys(S.disc.kinds||{}).filter(k=>S.disc.kinds[k]<=-2)}}
const tried=()=>{const t=new Set();for(const e of S.exps)if(!e.demo&&e.kind==="done"&&e.venue)t.add(e.venue.kind);return t};
const visited=v=>S.exps.some(e=>!e.demo&&e.kind==="done"&&(e.venue&&e.venue.id===v.id||String(e.title).toLowerCase()===v.name.toLowerCase()));

/* Score one place for a group. Interest fit for a group is mostly the average, partly the least-happy person. */
function scoreVenue(v,q,ctx){const f={},maxKm=q.km||S.disc.maxKm||8,hr=new Date(ctx.when||Date.now()).getHours();
  f.distance=v.distKm==null?4:v.distKm>maxKm?-100:Math.round(25*(1-v.distKm/maxKm));
  const fit=t=>{const gs=DGROUPS[v.kind]||[];return gs.length?Math.max(0,...gs.map(g=>t.w[g]||0)):0},fits=ctx.tastes.map(fit);
  f.interests=Math.round(20*(fits.reduce((a,b)=>a+b,0)/fits.length*.6+Math.min(...fits)*.4));
  if(q.kinds&&q.kinds.length)f.request=q.kinds.includes(v.kind)?20:-10;
  const est=v.price?PRICE_PP[v.price]:v.free?[0,0]:null,people=ctx.people||2,budget=q.budget!=null?q.budget:S.disc.budget;
  if(budget!=null&&est)f.budget=est[0]*people>budget?-200:est[1]*people<=budget?10:0;
  if(v.rating)f.rating=Math.round((v.rating-3.8)*8);if(v.rank!=null)f.relevance=Math.max(0,6-v.rank);
  if(q.now)f.open=v.openNow===true?10:v.openNow===false?-80:0;
  if(ctx.wx&&["outdoors","trail"].includes(v.kind)){if(ctx.wx.wet)f.weather=-20;else if(ctx.wx.alerts&&ctx.wx.alerts.length)f.weather=-8;else if(ctx.wx.temp!=null&&ctx.wx.temp>=60&&ctx.wx.temp<=82)f.weather=6}
  if(ctx.wx&&ctx.wx.wet&&["culture","games","coffee","class","wellness"].includes(v.kind))f.weather=5;
  if(v.kind==="coffee")f.time=hr<12?6:hr>17?-10:0;else if(["drinks","music"].includes(v.kind))f.time=hr>=17?6:-8;
  const fb=(S.disc.fb||{})[v.id];if(fb)f.feedback=fb>0?15:-200;const kfb=(S.disc.kinds||{})[v.kind];if(kfb)f.feedback=(f.feedback||0)+Math.max(-30,Math.min(10,kfb*5));
  if(q.novel)f.novelty=visited(v)?-40:ctx.tried.has(v.kind)?0:15;else if(visited(v))f.novelty=-8;
  if(q.transit)f.transit=v.distKm!=null&&v.distKm>1.2?-4:3;
  const total=Object.values(f).reduce((a,b)=>a+b,0);return{f,total}}
const FACT_L={relevance:"a top Yelp match",distance:"close by",interests:"fits your interests",request:"what you asked for",budget:"within budget",rating:"well rated",open:"open now",weather:"weather",time:"time of day",feedback:"your feedback",novelty:"something new",transit:"easy without a car"};
function reasons(s,group){return Object.entries(s.f).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k==="interests"&&group?"suits all of you":FACT_L[k])}
function costTxt(v,people){if(v.free)return{t:"Free (demo)",est:true};const r=v.price&&PRICE_PP[v.price];return r?{t:"≈ $"+r[0]*people+"–"+r[1]*people+" for "+people+" ("+"$".repeat(v.price)+")",est:true}:{t:"Cost unknown",est:true}}

/* ---------- group: partners who chose to share their taste with me ---------- */
async function readTastes(){const out=[];for(const id of Soc.conns()){const r=Soc.rel[id],d=(Soc.prefs||{})[id];if(!r||!d)continue;const it=(d.items||[]).find(x=>x&&x.k===r.in);if(!it)continue;
    try{const t=Soc.cache["p"+it.c]||(Soc.cache["p"+it.c]=await K.decJ(r.key,it.c));if(t&&t.w)out.push({id,t:{w:Object.fromEntries(Object.entries(t.w).filter(([g,v])=>INTS[g]&&typeof v==="number").map(([g,v])=>[g,Math.max(-1,Math.min(1,v))])),price:num(t.price),km:num(t.km)}})}catch(e){}}

/* ---------- AI: short explanations, only from the facts given; any place it names that we didn't send is dropped ---------- */
async function aiNotes(recs,q,group){if(!SAMPLE||!recs.length||S.disc.ai===false)return{};
  const facts=recs.slice(0,6).map(r=>({id:r.v.id,name:r.v.name,kind:DKIND[r.v.kind],distance:kmTxt(r.v.distKm),rating:r.v.rating,priceLevel:r.v.price?"$".repeat(r.v.price):null,openNow:r.v.openNow,reasons:r.why}));
  const prompt=["You write one short sentence for each place below explaining why it suits this request in VOUZ, an app for couples and partners.",
    "Use only the facts given. Do not add opening hours, prices, events, menus, reviews or anything not listed. Do not invent places. Warm, plain, non-explicit. Under 140 characters each.",
    group?"They are planning for more than one person; never mention any one person's preferences, only that it suits the group.":"",
    'Reply with only JSON: {"notes":[{"id":"the id given","note":"sentence"}]}',
    "Request: "+(q.raw||"Suggest something for us"),"Places: "+JSON.stringify(facts)].filter(Boolean).join("\n");
  try{const v=await SAMPLE.json(prompt,{cache:{staleTime:6e5}});const ids=new Set(facts.map(f=>f.id)),out={};for(const n of ((v&&v.notes)||[]))if(n&&ids.has(n.id)&&typeof n.note==="string")out[n.id]=n.note.slice(0,160);return out}catch(e){return{}}}

/* ---------- running a search ---------- */
async function runDisc(kind){const d=ui.dsc,q=kind==="nearby"?{kinds:d.nk?[d.nk]:[],km:d.nkm||S.disc.maxKm||5,raw:""}:parseAsk(d.q);

  try{const people=d.who.length+1,tastes=[myTaste()],all=await readTastes().catch(()=>[]);for(const p of all)if(d.who.includes(p.id))tastes.push(p.t);
    const[res,wx]=await Promise.all([Disc.places(q),Disc.weather().catch(()=>null)]);
    const ctx={tastes,tried:tried(),wx,people,when:Date.now()};
    let recs=res.list.map(v=>{const s=scoreVenue(v,q,ctx);return{v,s,why:reasons(s,tastes.length>1)}}).filter(r=>r.s.total>-50&&(kind!=="nearby"||!d.nk||r.v.kind===d.nk));
    recs.sort((a,b)=>kind==="nearby"&&d.nsort==="dist"?(a.v.distKm??99)-(b.v.distKm??99):b.s.total-a.s.total);
    const seenK={};if(kind!=="nearby")recs=recs.filter(r=>(seenK[r.v.kind]=(seenK[r.v.kind]||0)+1)<=3);   // variety: at most 3 of a kind
    d[kind]={q,recs:recs.slice(0,kind==="nearby"?20:10),demo:res.demo,live:res.live,liveErr:res.liveErr,used:res.used,wx,notes:res.notes,at:Date.now(),group:tastes.length>1};
    S.disc.hist=(S.disc.hist||[]).concat([{at:Date.now(),q:q.raw||"(nearby)",n:recs.length}]).slice(-50);saveLocal();
    if(kind==="foryou"){render();const h=document.getElementById("fy-res");if(h&&h.scrollIntoView)h.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"});const notes=await aiNotes(d.foryou.recs,q,tastes.length>1);if(d.foryou&&d.foryou.q===q)d.foryou.ai=notes}}
  catch(e){d.err="That search didn't work. Try again."}
  finally{d.busy=false;render()}}

/* ---------- itineraries ---------- */
const SLOTS={day:[["11:00","coffee"],["12:00","culture"],["14:00","food"],["16:30","outdoors"]],evening:[["18:00","drinks"],["19:15","food"],["21:00","music"]],morning:[["09:00","coffee"],["10:30","outdoors"],["12:30","food"]]};
function planDate(q){const now=new Date();let d=new Date(now);if(q.day==="tomorrow")d.setDate(d.getDate()+1);else if(typeof q.day==="number"){const add=(q.day-now.getDay()+7)%7;d.setDate(d.getDate()+add)}return d}
async function buildItin(it,keepIdx){const d=ui.dsc,q=it.q,dp=q.daypart||(q.day==="today"&&new Date().getHours()>=15?"evening":"day"),slots=it.slots||SLOTS[dp],date=planDate(q);
  it.slots=slots;it.date=dayKey(date.getTime());it.daypart=dp;d.ibusy=true;render();
  const tastes=[myTaste()].concat((await readTastes().catch(()=>[])).filter(p=>d.who.includes(p.id)).map(p=>p.t)),people=d.who.length+1;
  const pools={},res=await Disc.places({...q,kinds:Array.from(new Set(slots.map(s=>s[1]))),term:null});it.demo=res.demo;it.liveErr=res.liveErr;
  const ctx={tastes,tried:tried(),wx:await Disc.weather().catch(()=>null),people};
  const stops=it.stops||[],used=new Set(stops.filter((s,i)=>keepIdx&&keepIdx.includes(i)).map(s=>s.v.id)),per=q.budget!=null?q.budget/slots.length:null;
  const out=[];let prev=Disc.center();
  for(let i=0;i<slots.length;i++){if(keepIdx&&keepIdx.includes(i)&&stops[i]){out.push(stops[i]);used.add(stops[i].v.id);prev=stops[i].v;continue}
    const[time,kind]=slots[i],cands=res.list.filter(v=>(v.kind===kind||(kind==="music"&&v.kind==="culture")||(kind==="culture"&&v.kind==="class"))&&!used.has(v.id)&&!(it.skip||[]).includes(v.id));
    const at=new Date(date);const[hh,mm]=time.split(":").map(Number);at.setHours(hh,mm,0,0);
    const sc=cands.map(v=>{const s=scoreVenue(v,{...q,kinds:[kind],budget:per,now:false},ctx),hop=hav(prev,v),shut=v.hours&&hoursAt(v.hours,at)===false;return{v,t:s.total-(hop!=null?hop*4:0)-(shut?120:0)+(v.hours&&!shut?6:0),s,shut}}).sort((a,b)=>b.t-a.t);
    const pick=sc[it.shuffle?Math.min(sc.length-1,Math.floor(Math.random()*Math.min(3,sc.length))):0];
    if(!pick){out.push({time,kind,v:null});continue}
    used.add(pick.v.id);const mode=modeFor(hav(prev,pick.v)||0,S.disc.travel);const leg=prev&&prev.lat!=null?await Disc.route(prev,pick.v,mode):null;
    out.push({time,kind,v:pick.v,leg,cost:costTxt(pick.v,people),why:reasons(pick.s,tastes.length>1),openAt:pick.v.hours?!pick.shut:null,hoursDay:pick.v.hours?hoursToday(pick.v.hours,at):null});prev=pick.v}
  it.stops=out;it.shuffle=false;it.people=people;
  const lo=out.reduce((a,s)=>a+(s.v&&s.v.price?PRICE_PP[s.v.price][0]*people:0),0),hi=out.reduce((a,s)=>a+(s.v&&s.v.price?PRICE_PP[s.v.price][1]*people:0),0);it.cost=hi?{t:"≈ $"+lo+"–"+hi,est:true}:null;
  d.ibusy=false;render()}
function icsFor(it){const pad=n=>String(n).padStart(2,"0"),dt=(day,hm)=>{const[y,m,dd]=day.split("-"),[h,mi]=hm.split(":");return y+m+dd+"T"+pad(h)+pad(mi)+"00"},esc2=s=>String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const ev=it.stops.filter(s=>s.v).map((s,i,a)=>{const end=a[i+1]?a[i+1].time:(()=>{const[h,m]=s.time.split(":").map(Number);return pad(Math.min(23,h+1))+":"+pad(m)})();
    return["BEGIN:VEVENT","UID:"+uid()+"@vouz","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+dt(it.date,s.time),"DTEND:"+dt(it.date,end),"SUMMARY:"+esc2(s.v.name+(s.v.demo?" (demo)":"")),"LOCATION:"+esc2(s.v.demo?"":s.v.addr),"DESCRIPTION:"+esc2("Planned in VOUZ. Not booked: check hours before you go."),"END:VEVENT"].join("\r\n")});
  return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//VOUZ//EN"].concat(ev,["END:VCALENDAR"]).join("\r\n")}

Object.assign(A,{
  dEx(e){ui.dsc.q=DISC_EX[+e.dataset.i];render()},
